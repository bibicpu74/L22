name: LineageOS 21.0 - star2lte Btrfs ZSTD + RBE16 + kernel BPF repair

on:
  workflow_dispatch:
    inputs:
      workspace_storage:
        description: "Android workspace: Btrfs ZSTD (default), or uncompressed plain"
        type: choice
        required: true
        default: btrfs_zstd
        options:
          - btrfs_zstd
          - plain
      debug_info_level:
        description: "Clang C/C++ DWARF: minimal (saves build space), none, or full"
        type: choice
        required: true
        default: debug_level_1
        options:
          - debug_level_1
          - debug_level_0
          - debug_level_g
      btrfs_zstd_level:
        description: "Btrfs workspace ZSTD level; 3 uses more local CPU"
        type: choice
        required: true
        default: '1'
        options:
          - '1'
          - '3'
      remote_jobs:
        description: "Parallel RBE actions (20 experimental; 16 previous stable)"
        type: choice
        required: true
        default: '20'
        options:
          - '16'
          - '20'
          - '24'
      jar_dedupe_mode:
        description: "Soong JAR dedupe: probe-only default, adaptive or disabled"
        type: choice
        required: true
        default: probe
        options:
          - probe
          - adaptive
          - off

permissions:
  contents: read

concurrency:
  group: los21-star2lte-rbe-full-rom-trial
  cancel-in-progress: false

jobs:
  rbe-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      BUILDBUDDY_API_KEY: "${{ secrets.BUILDBUDDY_API_KEY }}"
      WORKSPACE_STORAGE: "${{ inputs.workspace_storage }}"
      BTRFS_WORKSPACE_IMAGE_GIB: "220"
      # Official LineageOS 21 Soong option; changes emitted DWARF, not runtime ABI.
      # Full debug = debug_level_g; minimal = debug_level_1; none = debug_level_0.
      CLANG_DEFAULT_DEBUG_LEVEL: "${{ inputs.debug_info_level || 'debug_level_1' }}"
      BTRFS_ZSTD_LEVEL: "${{ inputs.btrfs_zstd_level || '1' }}"
      SOONG_PROFILE_INTERVAL_SAMPLES: "360"  # 10s monitor x 360 = about 60 minutes
      SOONG_PROFILE_TIMEOUT_SECONDS: "80"
      # Conservative Btrfs-only pilot on stable byte-identical Java JARs.
      # Duperemove preserves paths and file contents; never delete intermediates.
      JAR_DEDUPE_MODE: "${{ inputs.jar_dedupe_mode || 'probe' }}"
      JAR_DEDUPE_INTERVAL_SAMPLES: "360"  # probe about every 60 minutes
      JAR_DEDUPE_AGE_MINUTES: "20"
      JAR_DEDUPE_HASH_GIB: "2"          # bounded probe sampling; adaptive opt-in
      JAR_DEDUPE_MAX_FILES: "350"
      JAR_DEDUPE_MIN_FREE_GIB: "9"

      # Android / Soong RBE
      USE_RBE: "1"
      RBE_DIR: "prebuilts/remoteexecution-client/live"
      RBE_CXX_EXEC_STRATEGY: "remote"

      # Keep authenticated TLS via the existing loopback bridge; preserve the
      # BuildBuddy API key outside the uploaded diagnostic directory.
      # Forward plaintext h2c on loopback to a TLS-verified nginx gRPC proxy
      # which attaches BuildBuddy's x-buildbuddy-api-key header.
      RBE_service: "127.0.0.1:19099"
      RBE_service_no_security: "true"
      RBE_service_no_auth: "true"
      RBE_use_application_default_credentials: "false"
      RBE_use_rpc_credentials: "false"
      # Reclient 0.172 uses the matching standalone C/C++ dependency scanner.
      # execrel:// resolves scandeps_server next to the pinned reproxy binary.
      RBE_depsscanner_address: "execrel://"

      # Keep all RBE diagnostics in one place.
      RBE_log_dir: "/tmp/rbe-test"
      # No RBE_log_path: deprecated duplicate action log; proxy_log_dir is retained.
      RBE_proxy_log_dir: "/tmp/rbe-test"
      RBE_output_dir: "/tmp/rbe-test"
      RBE_reproxy_wait_seconds: "30"
      RBE_v: "0"
      # RBE logs are written into the compressed workspace through /tmp/rbe-test.
      # Keep provenance and clean older Git object packs only after graph generation.
      SAFE_GIT_OBJECT_TRIM: "1"
      # After recording a real revision-locked manifest, reclaim extra Git-only
      # object stores; not the checked-out clang/misc toolchain files.
      SAFE_GIT_EXTENDED_TRIM: "1"
      # Retain full RBE metrics and error tails; do not rotate a live reproxy FD.
      RBE_CLOSED_INFO_MAX_MIB: "32"
      RBE_LOG_SCAN_INTERVAL_SAMPLES: "6"
      DISK_PROFILE_INTERVAL_SAMPLES: "30"
      RBE_INFO_KEEP_MIB: "4"
      RBE_RRPL_KEEP_MIB: "32"

      # Android Soong uses remote Ninja concurrency independently of -j2.
      # Keep the 2-job local pool, highmem pool=1; selectable 16/20/24 remote actions.
      NINJA_REMOTE_NUM_JOBS: "${{ inputs.remote_jobs || '20' }}"
      NINJA_HIGHMEM_NUM_JOBS: "1"

      # Soong graph generation is local even with BuildBuddy RBE.
      # Go GC is tuned for the standard ~16-GB GitHub runner.
      # P0: GC target for the direct Go runtime patch in soong_build/main.go.
      SOONG_GOGC: "45"
      SOONG_GOMEMLIMIT: "6GiB"
      # Limit active Go workers during the memory-heavy graph generation only.
      SOONG_GRAPH_GOMAXPROCS: "2"
      # Bootstrap Go helpers get gctrace where environment is inherited.
      # Primary Soong telemetry comes from direct runtime.MemStats samples.
      SOONG_GRAPH_GC_TRACE: "1"
      SOONG_GRAPH_GC_TAIL_LINES: "200"
      # Stop before RAM and disk swap are both exhausted. This protects the
      # GitHub runner and preserves logs, but DOES NOT solve graph memory use.
      GRAPH_MEM_GUARD_ENABLED: "1"
      GRAPH_MEM_GUARD_RAM_MIB: "1024"
      GRAPH_MEM_GUARD_SWAP_MIB: "1536"
      GRAPH_MEM_GUARD_SAMPLES: "3"
      # Hybrid graph memory: compressed RAM swap first, disk swap second.
      # ZRAM is best-effort: GitHub runner kernels may not provide the module.
      SOONG_ZRAM_GIB: "8"
      SOONG_DISK_SWAP_GIB: "12"
      POST_GRAPH_DISK_SWAP_GIB: "4"
      # Keep 12 GiB free after graph swap allocation where possible.
      SOONG_SWAP_DISK_RESERVE_GIB: "12"

      # P1 storage trim: worktree-only, measured with df before/after.
      # Preserve Linux toolchains and the API 33 reference ABI dumps used by this trim.
      STORAGE_TRIM_DARWIN_HOST_TOOLS: "1"
      # Experimental: keep VNDK ABI versions 32, 33 and R; remove 29..31 only.
      # Set to "0" to retain all VNDK reference dumps for stricter validation.
      STORAGE_TRIM_OLD_VNDK_ABI: "1"

      # GiB of available disk space (statvfs/df -B1, not rounded df -h).
      # Experimental 7-GiB floor requested for a deeper build trial.
      # Never let the free space reach zero; packaging may still need more.
      DISK_WARN_GIB: "10"
      DISK_STOP_GIB: "1"
      # Preserve time for post-build metrics and artifact upload; no guarantee
      # the ~173k-Ninja-edge ROM fits within 6 hours even after optimization.
      # Whole-job limit on GitHub-hosted runners: 360 minutes.
      FULL_ROM_SOFT_DEADLINE_MINUTES: "360"

    steps:
      - name: Reclaim root disk
        shell: bash
        run: |
          set -e
          sudo swapoff -a || true
          sudo rm -f /swapfile /build-swap /mnt/swapfile || true
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/share/swift \
            /usr/local/share/powershell \
            /usr/local/lib/node_modules \
            /usr/local/graalvm \
            /usr/share/rust \
            /usr/share/php* || true

          mkdir -p /home/runner/work/los /tmp/rbe-test
          # Start the total-job clock before dependency install and repo sync.
          date +%s > /tmp/rbe-test/job-start-epoch.txt

          echo "=== DISK ==="
          df -h /
          echo "=== MEMORY ==="
          free -h
          echo "=== CPU ==="
          nproc

          # Persist a clean-runner baseline before package installation/sync.
          # No tokens or secrets are written to this log.
          TS=/tmp/rbe-test/resource-samples.tsv
          printf 'timestamp\tstage\tdisk_available_bytes\tdisk_used_bytes\tmem_available_kib\n' > "$TS"
          printf '%s\tpost-reclaim\t%s\t%s\t%s\n' \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            "$(df -B1 --output=avail / | tail -n1 | tr -d ' ')" \
            "$(df -B1 --output=used / | tail -n1 | tr -d ' ')" \
            "$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)" >> "$TS"

      - name: Checkout local manifest
        uses: actions/checkout@v4
        with:
          path: repo-config

      - name: Install build dependencies
        working-directory: /home/runner/work
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc \
            bison \
            build-essential \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            git-lfs \
            gnupg \
            gperf \
            imagemagick \
            lib32readline-dev \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libsdl1.2-dev \
            libssl-dev \
            libxml2 \
            libxml2-utils \
            lzop \
            pngcrush \
            rsync \
            schedtool \
            squashfs-tools \
            btrfs-progs \
            xsltproc \
            zip \
            zlib1g-dev \
            zstd \
            python3 \
            python-is-python3 \
            openjdk-21-jdk-headless \
            ninja-build \
            nginx \
            ca-certificates \
            openssl \
            unzip

          # Optional storage experiment must not block the ROM toolchain.
          if ! command -v duperemove >/dev/null 2>&1; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y duperemove \
              || echo '::warning::duperemove unavailable; JAR scan remains read-only.'
          fi

          mkdir -p "$HOME/bin"
          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Validate BuildBuddy secret
        shell: bash
        run: |
          set -e
          if [ -z "${BUILDBUDDY_API_KEY:-}" ]; then
            echo "::error::BUILDBUDDY_API_KEY secret is missing."
            exit 1
          fi

      # A single filesystem for .repo, the entire Android source tree, prebuilts
      # and out/. The sparse image is a LOGICAL cap, NOT extra physical storage.
      # Root df, not inner Btrfs df, is the authoritative disk safety guard.
      - name: Mount compressed Btrfs ZSTD workspace before repo sync
        if: ${{ inputs.workspace_storage == 'btrfs_zstd' }}
        working-directory: /home/runner/work
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE=/home/runner/work/los
          BACKING=/tmp/los20-workspace-btrfs.img
          mkdir -p /tmp/rbe-test "$WORKSPACE"
          if mountpoint -q "$WORKSPACE" || [ -n "$(ls -A "$WORKSPACE")" ]; then
            echo '::error::Android workspace must be empty before Btrfs setup.'
            exit 1
          fi
          # Never fallocate the image: physical blocks must grow on demand.
          truncate -s "${BTRFS_WORKSPACE_IMAGE_GIB}G" "$BACKING"
          sudo mkfs.btrfs -f -m single -d single "$BACKING" \
            > /tmp/rbe-test/btrfs-mkfs.log 2>&1
          case "$BTRFS_ZSTD_LEVEL" in 1|3) ;; *) echo '::error::Unsupported ZSTD level'; exit 1 ;; esac
          sudo mount -t btrfs -o "loop,compress=zstd:${BTRFS_ZSTD_LEVEL},noatime" \
            "$BACKING" "$WORKSPACE"
          sudo chown "$(id -u):$(id -g)" "$WORKSPACE"
          test "$(stat -f -c '%T' "$WORKSPACE")" = btrfs
          echo '=== ANDROID 14 FULL WORKSPACE ZSTD ==='
          findmnt -T "$WORKSPACE" -o SOURCE,FSTYPE,OPTIONS
          df -hT / "$WORKSPACE"
          du -h "$BACKING"
          printf 'timestamp\tstage\troot_free_bytes\tbtrfs_free_bytes\timage_allocated_bytes\n' \
            > /tmp/rbe-test/btrfs-storage-samples.tsv
          root_free="$(df -B1 --output=avail / | tail -n1 | tr -d ' ')"
          if (( root_free < DISK_STOP_GIB * 1073741824 )); then
            echo "::error::Host root disk below ${DISK_STOP_GIB} GiB after Btrfs mount."
            exit 70
          fi

      - name: Relocate CI and reproxy diagnostics into Android workspace
        working-directory: /home/runner/work
        shell: bash
        run: |
          set -euo pipefail
          # RBE uses /tmp/rbe-test internally. Place its backing directory under
          # the existing compressed Btrfs workspace so INFO/rrpl do not fill /tmp.
          # Also works in plain mode; the reduction is compression-dependent.
          DST=/home/runner/work/los/rbe-diagnostics
          test -d /home/runner/work/los
          mkdir -p "$DST"
          if [ -L /tmp/rbe-test ]; then
            test "$(readlink -f /tmp/rbe-test)" = "$DST"
          else
            test -d /tmp/rbe-test
            cp -a /tmp/rbe-test/. "$DST/"
            rm -rf -- /tmp/rbe-test
            ln -s "$DST" /tmp/rbe-test
          fi
          echo "diagnostic_realpath=$(readlink -f /tmp/rbe-test)" > /tmp/rbe-test/diagnostic-location.txt
          # Check physical location, not du on the /tmp symlink (which yields 0).
          REAL_DIAG="$(readlink -f /tmp/rbe-test)"
          test "$REAL_DIAG" = "$DST"
          echo "diag_bytes=$(du -sk "$REAL_DIAG" | awk '{print $1*1024}')"
          df -hT / "$DST"
          findmnt -T "$DST" -o SOURCE,FSTYPE,OPTIONS
          echo 'Reproxy diagnostics are now stored in the Android workspace.'

      - name: Repo init and install local manifest
        working-directory: /home/runner/work
        shell: bash
        run: |
          set -e

          git config --global user.email "ci@local"
          git config --global user.name "ci"
          git config --global color.ui false
          # Initialize filters BEFORE repo sync; LineageOS WebView uses Git LFS.
          git lfs version
          git lfs install --skip-repo

          mkdir -p /home/runner/work/los
          cd /home/runner/work/los
          if [ "$WORKSPACE_STORAGE" = btrfs_zstd ]; then
            mountpoint -q "$PWD" || { echo '::error::Btrfs mount missing before repo init.'; exit 1; }
            test "$(stat -f -c '%T' "$PWD")" = btrfs
          fi

          repo init \
            --depth=1 \
            --git-lfs \
            -u https://github.com/LineageOS/android.git \
            -b lineage-21.0

          mkdir -p .repo/local_manifests

          MANIFEST_SRC="$GITHUB_WORKSPACE/repo-config/.repo-local-manifests/star2lte.xml"
          MANIFEST_DST=".repo/local_manifests/star2lte.xml"

          if [ ! -s "$MANIFEST_SRC" ]; then
            echo "::error::Local manifest not found or empty: $MANIFEST_SRC"
            exit 1
          fi

          cp "$MANIFEST_SRC" "$MANIFEST_DST"

          # P0: remove the oversized multi-version reclient checkout BEFORE sync.
          # -a is required because no worktree has been checked out yet.
          # The pinned toolchain is fetched separately after sync and must be
          # self-contained. Never remove other Android prebuilts here.
          echo "=== P0 RECLIENT PROJECT BEFORE TRIM ==="
          repo list -a -p > /tmp/rbe-test/manifest-projects-before-trim.txt
          if ! grep -Fxq 'prebuilts/remoteexecution-client' \
            /tmp/rbe-test/manifest-projects-before-trim.txt; then
            echo "::error::Expected remoteexecution-client project is missing from the manifest; review before trimming."
            exit 1
          fi

          # Discover actual manifest project names, never assume name=path.
          # Only remove the explicit Linux-irrelevant host entries, if present.
          repo manifest -o /tmp/rbe-test/pre-storage-trim-manifest.xml
          python3 - <<'PYHOSTTRIM'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          tree=ET.parse('/tmp/rbe-test/pre-storage-trim-manifest.xml')
          seen={p.get('path',p.get('name')):p.get('name')
                for p in tree.getroot().findall('.//project')}
          targets=['prebuilts/remoteexecution-client',
                   'prebuilts/clang/host/darwin-x86',
                   'prebuilts/android-emulator',
                   'prebuilts/bazel/darwin-x86_64',
                   'prebuilts/go/darwin-x86']
          if 'prebuilts/remoteexecution-client' not in seen:
              raise SystemExit('Required RBE project not found before trim')
          root=ET.Element('manifest')
          for target in targets:
              name=seen.get(target)
              if name:
                  ET.SubElement(root,'remove-project',{'name':name,'optional':'true'})
                  print(f'Safe manifest removal: {target} -> {name}')
              else:
                  print(f'Already absent from manifest: {target}')
          out=Path('.repo/local_manifests/zz-storage-trim.xml')
          ET.indent(root,space='    ')
          ET.ElementTree(root).write(out,encoding='UTF-8',xml_declaration=True)
          PYHOSTTRIM

          repo list -a -p > /tmp/rbe-test/manifest-projects-after-trim.txt
          if grep -Fxq 'prebuilts/remoteexecution-client' \
            /tmp/rbe-test/manifest-projects-after-trim.txt; then
            echo "::error::P0 trim failed: reclient project is still in the effective manifest."
            exit 1
          fi
          repo manifest -o /tmp/rbe-test/effective-manifest-after-trim.xml
          echo 'P0 trim verified: prebuilts/remoteexecution-client will NOT be repo-synced.' \
            | tee /tmp/rbe-test/p0-storage-trim-status.txt

          echo '=== VERIFY STORAGE PROJECT REMOVALS (EFFECTIVE MANIFEST) ==='
          for removed in \
            prebuilts/clang/host/darwin-x86 \
            prebuilts/android-emulator \
            prebuilts/bazel/darwin-x86_64 \
            prebuilts/go/darwin-x86; do
            if grep -Fxq "$removed" /tmp/rbe-test/manifest-projects-after-trim.txt; then
              echo "::error::Expected removed project is still present: $removed"
              exit 1
            fi
            echo "Removed from repo sync: $removed"
          done
          for required in \
            device/samsung/star2lte \
            device/samsung/exynos9810-common \
            device/samsung_slsi/sepolicy \
            kernel/samsung/exynos9810 \
            vendor/samsung/star2lte \
            vendor/samsung/exynos9810-common \
            hardware/samsung; do
            if ! grep -Fxq "$required" /tmp/rbe-test/manifest-projects-after-trim.txt; then
              echo "::error::Missing required device/vendor project: $required"
              exit 1
            fi
          done

          echo "=== LOCAL MANIFEST ==="
          sed -n '1,260p' "$MANIFEST_DST"
          echo "=== P0 STORAGE TRIM MANIFEST ==="
          cat .repo/local_manifests/zz-storage-trim.xml

      - name: Repo sync
        working-directory: /home/runner/work/los
        timeout-minutes: 120
        shell: bash
        run: |
          set -eo pipefail

          (
            while true; do
              echo "=== RESOURCE SNAPSHOT ==="
              df -h / | tail -1
              free -h | head -2
              sleep 30
            done
          ) &
          MONPID=$!
          trap 'kill "$MONPID" 2>/dev/null || true' EXIT

          if ! repo sync \
            -c \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune \
            -j"$(nproc)"; then
            echo "::warning::Parallel repo sync failed; retrying with -j4."
            repo sync \
              -c \
              --no-clone-bundle \
              --no-tags \
              --prune \
              -j4
          fi

          echo "=== POST-SYNC DISK ==="
          df -h / /home/runner/work/los

      - name: Capture locked source manifest before checkout modifications
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set -euo pipefail
          FILE=/tmp/rbe-test/source-manifest-locked.xml
          repo manifest -r -o "$FILE"
          python3 - "$FILE" <<'PYLOCK'
          import sys, xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot()
          projects=root.findall('.//project')
          if root.tag != 'manifest' or len(projects) < 100:
              raise SystemExit('Locked manifest unexpectedly empty or too small')
          bad=[p.get('path') or p.get('name') for p in projects
               if not p.get('revision')]
          if bad: raise SystemExit('Missing pinned revision: '+str(bad[:5]))
          print(f'Locked source manifest contains {len(projects)} projects')
          PYLOCK
          sha256sum "$FILE" > /tmp/rbe-test/source-manifest-locked.sha256

      # Collect post-sync storage attribution while the tree is still clean.
      # This is diagnostic-only and does not mutate .repo, source, or out.
      # Prevent a tiny LFS pointer from reaching veridex as an invalid APK.
      # Some Lineage trees have WebView inside a parent Git project; resolve
      # the repository root before applying the LFS include path.
      - name: Sonivox ARM preflight and narrowly guarded source fix
        working-directory: /home/runner/work/los
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          SRC=external/sonivox/arm-wt-22k/lib_src
          INC="$SRC/ARM_synth_constants_gnu.inc"
          CLANG=prebuilts/clang/host/linux-x86/clang-r510928/bin/clang
          LOG=/tmp/rbe-test/sonivox-preflight.log
          mkdir -p /tmp/rbe-test
          exec > >(tee "$LOG") 2>&1
          test -s "$INC"
          test -x "$CLANG"
          echo '=== SONIVOX SOURCE CHECK, LINE 70-115 ==='
          nl -ba "$INC" | sed -n '70,115p'
          # This is deliberately a *single* syntax repair. Do not rewrite
          # all assembler conditionals or disable dependency scanning globally.
          python3 - "$INC" <<'PYSONIVOX'
          from pathlib import Path
          import sys, re, difflib
          path = Path(sys.argv[1]); orig = path.read_text()
          lines = orig.splitlines(keepends=True)
          # Track CPP conditional depth; assembler .if/.endif are distinct.
          depth = 0; orphans = []
          for i, line in enumerate(lines):
              if re.match(r'^\s*#\s*(?:if|ifdef|ifndef)\b',line):
                  depth += 1
              elif re.match(r'^\s*#\s*endif\b',line):
                  if depth: depth -= 1
                  else: orphans.append(i)
          print('orphan_cpp_endif_lines=', [i+1 for i in orphans])
          if not orphans:
              print('No unmatched #endif; no patch needed')
              sys.exit(0)
          # Apply only the known reported location and only if its corresponding
          # assembler conditional is visible in this same source section.
          if len(orphans) != 1 or orphans[0] != 97:
              sys.exit('Unexpected Sonivox CPP imbalance; refuse speculative patch')
          i = orphans[0]
          if not re.fullmatch(r'\s*#\s*endif\s*(?:\r?\n)?',lines[i]):
              sys.exit('Unexpected line 98 content; refusing patch')
          # Assembler .if uses --defsym values; the closing line must be .endif.
          if not any(re.match(r'^\s*\.if\b',lines[j]) for j in range(max(0,i-60),i)):
              sys.exit('No nearby assembler .if to match; refusing patch')
          lines[i] = re.sub(r'#\s*endif', '.endif', lines[i], count=1)
          repaired=''.join(lines)
          for ln in difflib.unified_diff(orig.splitlines(True),repaired.splitlines(True),fromfile='original',tofile='sonivox-guarded-fix'):
              print(ln,end='')
          path.write_text(repaired)
          PYSONIVOX
          echo '=== REAL CLANG CPP VALIDATION ==='
          # Preprocessor path matches -xassembler-with-cpp; use the same source
          # files and include tree as the failing ARM objects.
          for name in ARM-E_filter_gnu ARM-E_mastergain_gnu; do
            "$CLANG" -E -x assembler-with-cpp -target armv7a-linux-androideabi10000               -I"$SRC" "$SRC/$name.s"               -o "/tmp/rbe-test/${name}.preprocessed.s"
            test -s "/tmp/rbe-test/${name}.preprocessed.s"
          done
          git -C external/sonivox diff -- arm-wt-22k/lib_src/ARM_synth_constants_gnu.inc             > /tmp/rbe-test/sonivox-fix.patch || true
          echo 'SONIVOX_CPP_PREFLIGHT_PASSED'

      - name: Resolve and validate Chromium WebView arm64 Git LFS
        working-directory: /home/runner/work/los
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          mkdir -p /tmp/rbe-test
          LOG=/tmp/rbe-test/webview-lfs-check.log
          APK=external/chromium-webview/prebuilt/arm64/webview.apk
          DIR="$(dirname "$APK")"
          {
            echo '=== GIT LFS ==='
            git lfs version
            echo '=== WEBVIEW LFS PROJECTS ==='
            repo list -a -p | grep -E '^external/chromium-webview(/|$)' || true
          } | tee "$LOG"

          # Some manifests don't contain this prebuilt at this exact path.
          # Do not invent/download an APK from another branch in that case.
          if [ ! -e "$APK" ]; then
            if repo list -a -p | grep -Fxq "$DIR"; then
              echo "::error::WebView arm64 project exists, but APK missing: $APK" | tee -a "$LOG"
              exit 1
            fi
            echo "WebView APK absent at $APK; this manifest may use another WebView source." | tee -a "$LOG"
            exit 0
          fi

          REPO_ROOT="$(git -C "$DIR" rev-parse --show-toplevel)"
          REL_APK="$(realpath --relative-to="$REPO_ROOT" "$PWD/$APK")"
          {
            echo "git_root=$REPO_ROOT"
            echo "git_relative_apk=$REL_APK"
            echo "original_size_bytes=$(stat -c %s "$APK")"
            git -C "$REPO_ROOT" lfs ls-files --long | grep -F 'webview.apk' || true
          } | tee -a "$LOG"
          if [[ "$(head -c 96 "$APK")" == 'version https://git-lfs.github.com/spec/v1'* ]]; then
            echo 'Detected Git LFS pointer; fetching the exact checkout revision.' | tee -a "$LOG"
            git -C "$REPO_ROOT" lfs pull --include="$REL_APK" --exclude='' \
              2>&1 | tee /tmp/rbe-test/webview-lfs-pull.log
            git -C "$REPO_ROOT" lfs checkout "$REL_APK" \
              2>&1 | tee -a /tmp/rbe-test/webview-lfs-pull.log
          fi
          python3 - "$APK" <<'PYWEBVIEW'
          import pathlib,sys,zipfile
          file=pathlib.Path(sys.argv[1])
          with file.open('rb') as f: prefix=f.read(256)
          if prefix.startswith(b'version https://git-lfs.github.com/spec/v1'):
              sys.exit('ERROR: WebView APK is still an LFS pointer')
          if file.stat().st_size < 10 * 1024 * 1024 or prefix[:2] != b'PK':
              sys.exit('ERROR: WebView prebuilt is too small or not an APK/ZIP')
          with zipfile.ZipFile(file) as apk:
              if 'AndroidManifest.xml' not in apk.namelist():
                  sys.exit('ERROR: WebView APK missing AndroidManifest.xml')
              print(f'WebView arm64 APK verified; bytes={file.stat().st_size}')
          PYWEBVIEW
          echo '=== WEBVIEW APK ZIP CRC CHECK ===' | tee -a "$LOG"
          unzip -tqq "$APK" | tee /tmp/rbe-test/webview-unzip-test.txt
          sha256sum "$APK" | tee /tmp/rbe-test/webview-sha256.txt
          echo 'WebView LFS preflight passed.' | tee -a "$LOG"

      - name: Record Btrfs workspace use after repo sync
        if: ${{ inputs.workspace_storage == 'btrfs_zstd' }}
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set -euo pipefail
          BACKING=/tmp/los20-workspace-btrfs.img
          mountpoint -q "$PWD"
          test "$(stat -f -c '%T' "$PWD")" = btrfs
          echo '=== WORKSPACE AFTER SYNC ==='
          df -hT / "$PWD"
          stat -c 'image_size_bytes=%s image_allocated_blocks=%b block_bytes=%B' "$BACKING"
          sudo btrfs filesystem usage -b "$PWD" \
            > /tmp/rbe-test/btrfs-post-sync-usage.txt 2>&1 || true
          root_avail="$(df -B1 --output=avail / | tail -n1 | tr -d ' ')"
          inner_avail="$(df -B1 --output=avail "$PWD" | tail -n1 | tr -d ' ')"
          if (( root_avail < DISK_STOP_GIB * 1073741824 || inner_avail < DISK_STOP_GIB * 1073741824 )); then
            echo '::error::Disk low after repo sync, before Android build.'
            exit 70
          fi

      - name: Profile storage after repo sync
        if: success()
        working-directory: /home/runner/work/los
        timeout-minutes: 20
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/rbe-test
          LOG=/tmp/rbe-test/disk-analysis.log
          TS=/tmp/rbe-test/resource-samples.tsv
          if [ ! -s "$TS" ]; then
            printf 'timestamp\tstage\tdisk_available_bytes\tdisk_used_bytes\tmem_available_kib\n' > "$TS"
          fi

          sample() {
            local stage="$1" available used mem
            available="$(df -B1 --output=avail "$PWD" | tail -n 1 | tr -d ' ')"
            used="$(df -B1 --output=used "$PWD" | tail -n 1 | tr -d ' ')"
            mem="$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)"
            printf '%s\t%s\t%s\t%s\t%s\n' \
              "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$stage" "$available" "$used" "$mem" >> "$TS"
          }
          sample post-sync

          {
            echo '=== POST-SYNC DISK ANALYSIS ==='
            date -u +'%Y-%m-%dT%H:%M:%SZ'
            echo '=== MOUNT POINTS ==='
            df -hT / /mnt /home/runner/work/los
            echo '=== BLOCK DEVICES ==='
            lsblk -o NAME,SIZE,FSTYPE,MOUNTPOINTS
            echo '=== INODES ==='
            df -i /home/runner/work/los
            echo '=== GIT OBJECT STORAGE ==='
            du -sh .repo 2>/dev/null || true
            echo '=== OUTPUT TREE ==='
            du -sh out 2>/dev/null || true
            echo '=== SOURCE TREE - FIRST LEVEL ==='
            du -xhd1 . 2>/dev/null | sort -h | tail -n 50 || true
            echo '=== RUNNER SYSTEM FOOTPRINT ==='
            # Avoid scanning /home/runner/work twice (large Android checkout).
            sudo du -xhd1 /opt /usr/local /var 2>/dev/null | sort -h | tail -n 35 || true
            du -sh /home/runner/.cache /home/runner/.local /home/runner/.cargo \
              2>/dev/null || true
            echo '=== MEMORY ==='
            free -h
            echo '=== AVAILABLE DISK (BYTES) ==='
            df -B1 --output=source,size,used,avail,pcent,target /home/runner/work/los
          } 2>&1 | tee "$LOG"

          # Detail the largest checked-out prebuilts and repo metadata.
          # Diagnostic-only: never delete, prune, or mutate Android sources.
          echo '=== PREBUILTS STORAGE BREAKDOWN ==='
          if [ -d prebuilts ]; then
            du -xhd1 prebuilts 2>/dev/null | sort -h \
              > /tmp/rbe-test/prebuilts-size.log || true
            du -xhd2 prebuilts 2>/dev/null | sort -h \
              > /tmp/rbe-test/prebuilts-detail.log || true
            echo '--- PREBUILTS LEVEL 1 ---'
            tail -n 60 /tmp/rbe-test/prebuilts-size.log || true
            echo '--- PREBUILTS LEVEL 2 (LARGEST 80) ---'
            tail -n 80 /tmp/rbe-test/prebuilts-detail.log || true
          else
            echo '::warning::prebuilts directory was not found.'
          fi

          echo '=== REPO METADATA STORAGE BREAKDOWN ==='
          if [ -d .repo ]; then
            du -xhd2 .repo 2>/dev/null | sort -h \
              > /tmp/rbe-test/repo-size.log || true
            echo '--- REPO METADATA (LARGEST 40) ---'
            tail -n 40 /tmp/rbe-test/repo-size.log || true
          else
            echo '::warning::.repo directory was not found.'
          fi
          # Deep-dive into the largest storage groups from previous runs.
          # Never delete source, prebuilts, .repo objects, or installed tools.
          echo '=== CLANG TOOLCHAIN VERSION BREAKDOWN ==='
          if [ -d prebuilts/clang ]; then
            du -xhd4 prebuilts/clang 2>/dev/null | sort -h \
              > /tmp/rbe-test/clang-detail.log || true
            echo '--- CLANG LARGEST 35 ---'
            tail -n 35 /tmp/rbe-test/clang-detail.log || true
            find prebuilts/clang/host -mindepth 2 -maxdepth 2 \
              -type d -name 'clang-*' -print 2>/dev/null | sort \
              > /tmp/rbe-test/clang-versions.log || true
          else
            echo '::warning::prebuilts/clang missing'
          fi

          echo '=== GRADLE PLUGIN BREAKDOWN ==='
          if [ -d prebuilts/gradle-plugin ]; then
            du -xhd4 prebuilts/gradle-plugin 2>/dev/null | sort -h \
              > /tmp/rbe-test/gradle-detail.log || true
            tail -n 25 /tmp/rbe-test/gradle-detail.log || true
          fi

          echo '=== PLATFORM GIT OBJECT BREAKDOWN ==='
          if [ -d .repo/project-objects/platform ]; then
            du -xhd4 .repo/project-objects/platform 2>/dev/null | sort -h \
              > /tmp/rbe-test/platform-objects-detail.log || true
            tail -n 35 /tmp/rbe-test/platform-objects-detail.log || true
          fi

          echo '=== MANIFEST PREBUILTS PROJECT PATHS ==='
          # A candidate inventory only: NEVER change the synced manifest.
          repo list -p 2> /tmp/rbe-test/prebuilts-projects-errors.log \
            | grep -E '^prebuilts(/|$)' \
            > /tmp/rbe-test/prebuilts-projects.log || true
          echo "Registered prebuilts projects: $(wc -l < /tmp/rbe-test/prebuilts-projects.log)"
          sed -n '1,120p' /tmp/rbe-test/prebuilts-projects.log || true
          sample post-deep-storage-profile

          echo '=== DEEP STORAGE BASELINE COMPLETE ==='

      # P1: remove only unwanted host-platform binaries and historical
      # ABI reference dumps from checked-out worktrees. This DOES NOT reclaim
      # packed objects in .repo/project-objects: they remain for this run.
      - name: P1 reclaim unused Darwin binaries and historical VNDK ABI worktrees
        if: success()
        working-directory: /home/runner/work/los
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          REPORT=/tmp/rbe-test/storage-trim-p1.log
          TABLE=/tmp/rbe-test/storage-trim-p1.tsv
          TS=/tmp/rbe-test/resource-samples.tsv
          mkdir -p /tmp/rbe-test
          printf 'path\tpre_kib\tstatus\n' > "$TABLE"
          exec > >(tee "$REPORT") 2>&1

          echo '=== P1 STORAGE TRIM (WORKTREE ONLY) ==='
          echo "Darwin trimming: ${STORAGE_TRIM_DARWIN_HOST_TOOLS}"
          echo "Historical VNDK ABI trimming: ${STORAGE_TRIM_OLD_VNDK_ABI}"
          before_bytes="$(df -B1 --output=avail "$PWD" | tail -n1 | tr -d ' ')"
          echo "disk_available_before_bytes=$before_bytes"

          # Whitelist protects source and vendor trees from dynamic path input.
          trim_known_path() {
            local rel="$1" kib=0
            case "$rel" in
              prebuilts/rust/darwin-x86|prebuilts/clang-tools/darwin-x86|prebuilts/build-tools/darwin-x86|\
              prebuilts/jdk/jdk8/darwin-x86|prebuilts/jdk/jdk9/darwin-x86|\
              prebuilts/jdk/jdk11/darwin-x86|prebuilts/jdk/jdk17/darwin-x86|\
              prebuilts/abi-dumps/vndk/29|prebuilts/abi-dumps/vndk/30|prebuilts/abi-dumps/vndk/31)
                ;;
              *) echo "::error::Refusing non-whitelisted removal: $rel"; return 2 ;;
            esac
            if [ -L "$rel" ]; then
              echo "SKIP symlink $rel"
              printf '%s\t0\tskipped-symlink\n' "$rel" >> "$TABLE"
              return 0
            fi
            if [ ! -d "$rel" ]; then
              echo "SKIP absent $rel"
              printf '%s\t0\tabsent\n' "$rel" >> "$TABLE"
              return 0
            fi
            kib="$(du -sk -- "$rel" | awk '{print $1}')"
            echo "TRIM $rel size=$((kib / 1024)) MiB (checked-out files only)"
            rm -rf -- "$rel"
            if [ -e "$rel" ]; then
              echo "::error::Failed to remove $rel"
              return 1
            fi
            printf '%s\t%s\tremoved\n' "$rel" "$kib" >> "$TABLE"
          }

          if [ "${STORAGE_TRIM_DARWIN_HOST_TOOLS}" = 1 ]; then
            # Abort the Linux-host trim if the Rust Linux toolchain is absent.
            if [ -d prebuilts/rust/linux-x86 ] && [ -d prebuilts/clang/host/linux-x86 ]; then
              for rel in \
                prebuilts/rust/darwin-x86 \
                prebuilts/clang-tools/darwin-x86 \
                prebuilts/build-tools/darwin-x86 \
                prebuilts/jdk/jdk8/darwin-x86 \
                prebuilts/jdk/jdk9/darwin-x86 \
                prebuilts/jdk/jdk11/darwin-x86 \
                prebuilts/jdk/jdk17/darwin-x86; do
                trim_known_path "$rel"
              done
            else
              echo '::warning::Linux host toolchains not found; Darwin trim skipped for safety.'
            fi
          fi

          if [ "${STORAGE_TRIM_OLD_VNDK_ABI}" = 1 ]; then
            # This storage-trim heuristic retains API/VNDK 33; keep 32 as
            # compatibility headroom, plus 33, R, files at repository root.
            # Do not remove the abi-dumps project or disable ABI checks.
            root=prebuilts/abi-dumps/vndk
            if [ ! -L "$root" ] && [ -s "$root/Android.bp" ] \
               && [ -d "$root/32" ] && [ -d "$root/33" ]; then
              echo 'VNDK ABI trim guard passed: versions 32 and 33 and Android.bp exist.'
              for rel in \
                prebuilts/abi-dumps/vndk/29 \
                prebuilts/abi-dumps/vndk/30 \
                prebuilts/abi-dumps/vndk/31; do
                trim_known_path "$rel"
              done
            else
              echo '::warning::VNDK ABI layout differs from the expected trim layout; skipping ABI trim.'
            fi
          fi

          # Strict post-checks for the host toolchain and current ABI reference.
          test -d prebuilts/rust/linux-x86
          test -d prebuilts/clang/host/linux-x86
          test -d prebuilts/abi-dumps/vndk/33
          test -d prebuilts/abi-dumps/vndk/32
          after_bytes="$(df -B1 --output=avail "$PWD" | tail -n1 | tr -d ' ')"
          reclaimed_bytes="$((after_bytes - before_bytes))"
          echo '=== P1 STORAGE RESULT ==='
          echo "disk_available_after_bytes=$after_bytes"
          echo "disk_available_delta_bytes=$reclaimed_bytes"
          df -h "$PWD"
          cat "$TABLE"
          if (( reclaimed_bytes < 0 )); then
            echo '::warning::Net free space decreased during trim; check concurrent processes.'
          fi
          if [ -s "$TS" ]; then
            printf '%s\tpost-worktree-trim\t%s\t%s\t%s\n' \
              "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$after_bytes" \
              "$(df -B1 --output=used "$PWD" | tail -n1 | tr -d ' ')" \
              "$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)" >> "$TS"
          fi
          echo 'P1 trim changes the checkout only, not .repo Git object packs.'

      - name: Verify star2lte product registration
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set -eo pipefail

          echo "=== PRODUCT REGISTRATION ==="

          MATCHES="$(
            grep -R -l \
              --include='AndroidProducts.mk' \
              'lineage_star2lte' \
              device vendor 2>/dev/null | head -20 || true
          )"

          if [ -z "$MATCHES" ]; then
            echo "::error::Could not find lineage_star2lte in any AndroidProducts.mk."
            echo "The local manifest did not sync/register the star2lte product correctly."
            find device vendor -maxdepth 4 -name AndroidProducts.mk -print 2>/dev/null | head -100 || true
            exit 1
          fi

          printf '%s\n' "$MATCHES"

          while IFS= read -r file; do
            [ -n "$file" ] || continue
            echo "--- $file"
            sed -n '1,180p' "$file"
          done <<< "$MATCHES"

      # Fail fast when the checkout does not expose Android 14 AP2A.
      # This is the release configured by LineageOS/android_build_release,
      # lineage-21.0; check the actual synced source rather than guessing.
      - name: Verify LineageOS 21 release AP2A
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set -euo pipefail
          CONFIG=build/release/release_config_map.mk
          RELEASE_FLAGS=build/release/build_config/ap2a.scl
          test -s "$CONFIG" || { echo "::error::Missing $CONFIG"; exit 1; }
          test -s "$RELEASE_FLAGS" || { echo "::error::Missing $RELEASE_FLAGS"; exit 1; }
          if ! grep -Eq 'declare-release-config,[[:space:]]*ap2a[[:space:]]*,' "$CONFIG"; then
            echo '::error::Release ap2a is not registered by this source tree.'
            cat "$CONFIG"
            exit 1
          fi
          echo '=== LINEAGEOS 21.0 AP2A RELEASE CONFIG VERIFIED ==='

      # AOSP reclient 0.172 with matching scandeps_server, pinned to one commit.
      # Keep repo-sync trim: only the single known-good live snapshot is fetched.
      # Ubuntu 24.04 ships ncurses6; legacy RenderScript Clang needs ncurses5.
      # Use the matching Jammy security packages, pinned with checksums from
      # packages.ubuntu.com, instead of making unsafe SONAME symlinks.

      # P0/P1: AOSP launches the main graph tool via `env -i`. Go environment
      # exports from GitHub Actions therefore do not reliably reach it.
      # Apply GC controls inside the real `soong_build` process instead.
      # No file mutation of .o/.a/.so while Ninja is running. The official
      # CLANG_DEFAULT_DEBUG_LEVEL is implemented in build/soong/cc/config/global.go.
      # A small preflight checks the actual Clang toolchain and writes a profiler
      # for bounded, read-only sampling later in the build.
      - name: Validate DWARF size optimization and install Soong profiler
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set -euo pipefail
          case "$CLANG_DEFAULT_DEBUG_LEVEL" in
            debug_level_0|debug_level_1|debug_level_g) ;;
            *) echo "::error::Invalid CLANG_DEFAULT_DEBUG_LEVEL"; exit 1 ;;
          esac
          case "$NINJA_REMOTE_NUM_JOBS" in 16|20|24) ;; *) exit 1 ;; esac
          test -s build/soong/cc/config/global.go
          if ! grep -Fq 'CLANG_DEFAULT_DEBUG_LEVEL' build/soong/cc/config/global.go; then
            echo '::error::Checked-out Soong does not implement CLANG_DEFAULT_DEBUG_LEVEL'
            exit 1
          fi
          CLANG=prebuilts/clang/host/linux-x86/clang-r510928/bin/clang++
          test -x "$CLANG"
          echo "debug_info_level=$CLANG_DEFAULT_DEBUG_LEVEL" > /tmp/rbe-test/dwarf-config.txt
          echo "remote_jobs=$NINJA_REMOTE_NUM_JOBS" >> /tmp/rbe-test/dwarf-config.txt
          echo "btrfs_zstd_level=$BTRFS_ZSTD_LEVEL" >> /tmp/rbe-test/dwarf-config.txt
          echo "profile_interval_samples=$SOONG_PROFILE_INTERVAL_SAMPLES" >> /tmp/rbe-test/dwarf-config.txt
          # This is an illustrative microbenchmark, not a 30 GiB savings claim.
          cat > /tmp/rbe-test/ci-dwarf-probe.cpp <<'CPPSAMPLE'
          template <typename T, int N> struct Chunk { T data[N]; int get(int i) const { return data[i%N]; } };
          template <int N> int calculate(int x) { Chunk<int,N> c{}; for (int i=0;i<N;i++) c.data[i]=i*x; return c.get(x); }
          extern "C" int probe(int x) { return calculate<97>(x)+calculate<197>(x)+calculate<397>(x); }
          CPPSAMPLE
          printf 'preset\tobject_bytes\n' > /tmp/rbe-test/dwarf-preflight.tsv
          for spec in full:-g minimal:-g1 none:-g0; do
            preset="${spec%%:*}"
            flag="${spec#*:}"
            obj="/tmp/rbe-test/ci-dwarf-${preset}.o"
            "$CLANG" -c -O2 "$flag" -gz=zstd -fdebug-default-version=5 \
              /tmp/rbe-test/ci-dwarf-probe.cpp -o "$obj"
            printf '%s\t%s\n' "$preset" "$(stat -c %s "$obj")" >> /tmp/rbe-test/dwarf-preflight.tsv
          done
          cat /tmp/rbe-test/dwarf-preflight.tsv
          cat > /tmp/rbe-test/soong_storage_probe.py <<'PYPROFILE'
          #!/usr/bin/env python3
          # Read-only / bounded-memory measurement of Soong intermediates.
          import collections, datetime, heapq, os, pathlib, sys, time
          root=pathlib.Path(sys.argv[1]); dest=pathlib.Path(sys.argv[2]); stage=sys.argv[3]
          dest.mkdir(parents=True,exist_ok=True)
          if not root.is_dir():
              print('SOONG_PROFILE_SKIPPED: intermediate directory missing'); sys.exit(0)
          by_type=collections.defaultdict(lambda:[0,0,0])
          by_module=collections.defaultdict(lambda:[0,0,0])
          by_area=collections.defaultdict(lambda:[0,0,0])
          top=[]; stack=[root]; files=0; total=0; allocated=0; start=time.monotonic()
          def update(agg,key,sz,bl):
              value=agg[key];value[0]+=1;value[1]+=sz;value[2]+=bl
          while stack:
              current=stack.pop()
              try:
                  with os.scandir(current) as it:
                      for ent in it:
                          try:
                              if ent.is_symlink(): continue
                              if ent.is_dir(follow_symlinks=False): stack.append(ent.path);continue
                              if not ent.is_file(follow_symlinks=False): continue
                              st=ent.stat(follow_symlinks=False)
                          except (OSError,ValueError):continue
                          rel=os.path.relpath(ent.path,root)
                          parts=rel.split(os.sep)
                          ext=pathlib.Path(ent.name).suffix.lower() or '[no extension]'
                          if ext not in ('.o','.a','.so','.jar','.dex','.vdex','.apk','.zip','.bc','.rsp','.d','.json','.ninja','.txt','.xml','.bin'):
                              ext='[other]'
                          sz=st.st_size;bl=st.st_blocks*512
                          update(by_type,ext,sz,bl)
                          update(by_area,parts[0] if parts else '[root]',sz,bl)
                          index=next((i for i,p in enumerate(parts) if p.startswith(('android_','linux_','darwin_'))),None)
                          module='/'.join(parts[:index]) if index and index>0 else '/'.join(parts[:min(len(parts),4)])
                          update(by_module,module,sz,bl)
                          total+=sz;allocated+=bl;files+=1
                          item=(sz,rel,bl)
                          if len(top)<60:heapq.heappush(top,item)
                          elif sz>top[0][0]:heapq.heapreplace(top,item)
              except (OSError,PermissionError):pass
          timestamp=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          def report(name,table,limit):
              p=dest/name
              with p.open('w') as f:
                  f.write('key\tfiles\tlogical_bytes\tst_blocks_bytes\n')
                  for key,(count,size,block) in sorted(table.items(),key=lambda x:x[1][1],reverse=True)[:limit]:
                      f.write(f'{key}\t{count}\t{size}\t{block}\n')
          report('soong-size-by-type.tsv',by_type,40)
          report('soong-size-by-area.tsv',by_area,50)
          report('soong-size-by-module.tsv',by_module,150)
          with (dest/'soong-largest-files.tsv').open('w') as f:
              f.write('logical_bytes\tst_blocks_bytes\tpath\n')
              for sz,rel,bl in sorted(top,reverse=True):f.write(f'{sz}\t{bl}\t{rel}\n')
          with (dest/'soong-profile-history.tsv').open('a') as f:
              f.write(f'{timestamp}\t{stage}\t{files}\t{total}\t{allocated}\t{time.monotonic()-start:.1f}\n')
          print(f'SOONG_PROFILE stage={stage} files={files} logical_gib={total/2**30:.2f} allocated_est_gib={allocated/2**30:.2f}')
          PYPROFILE
          python3 -m py_compile /tmp/rbe-test/soong_storage_probe.py
          echo 'SOONG_STORAGE_PROFILER_READY'

      - name: Install guarded Soong JAR dedupe analyzer
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set -euo pipefail
          case "$JAR_DEDUPE_MODE" in off|probe|adaptive) ;; *) exit 1 ;; esac
          if [ "$JAR_DEDUPE_MODE" = adaptive ] && [ "$WORKSPACE_STORAGE" != btrfs_zstd ]; then
            echo '::notice::Plain workspace selected; apply mode will automatically use read-only scan.'
          fi
          # This is a SHA-256 exact-file pilot, not global block-level dedupe.
          # No files are removed, renamed, modified, or reflink-replaced.
          cat > /tmp/rbe-test/ci_jar_dedupe.py <<'PY_JAR_DEDUPE'
          #!/usr/bin/env python3
          """Bounded, conservative CI probe/dedupe for byte-identical stable Soong JARs.
          No deletes, no file replacement, and no fstrim on root.  Conservative pilots only.
          """
          import argparse
          import collections
          import datetime
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import time
          import zipfile
          
          GIB=1<<30
          MIB=1<<20
          
          def physical(path):
              try:
                  st=os.stat(path)
                  return st.st_blocks*512
              except OSError:
                  return -1
          
          def host_free():
              st=os.statvfs('/')
              return st.f_bavail*st.f_frsize
          
          def timestamp():
              return datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          
          def write_tsv(path, header, rows):
              with path.open('w') as f:
                  f.write('\t'.join(header)+'\n')
                  for row in rows:
                      f.write('\t'.join(str(x).replace('\t',' ').replace('\n',' ') for x in row)+'\n')
          
          def census(root, min_bytes, max_bytes, stable_age):
              now=time.time()
              by_size=collections.defaultdict(list)
              total=0; count=0; stable_total=0; stable_count=0
              inode_seen=set()
              for base, dirs, files in os.walk(root,followlinks=False):
                  for name in files:
                      if not name.endswith('.jar'):continue
                      path=Path(base)/name
                      try:
                          st=path.lstat()
                          if not path.is_file() or path.is_symlink():continue
                      except OSError: continue
                      total+=st.st_size; count+=1
                      if st.st_size < min_bytes or st.st_size > max_bytes:continue
                      if now-st.st_mtime < stable_age:continue
                      identity=(st.st_dev,st.st_ino)
                      if identity in inode_seen:continue
                      inode_seen.add(identity)
                      stable_total+=st.st_size; stable_count+=1
                      by_size[st.st_size].append((path,st))
              return by_size, (total,count,stable_total,stable_count)
          
          def sha256_checked(path, old):
              h=hashlib.sha256()
              try:
                  with path.open('rb') as f:
                      first=os.fstat(f.fileno())
                      if (first.st_size,first.st_mtime_ns,first.st_ino)!=(old.st_size,old.st_mtime_ns,old.st_ino): return None
                      while True:
                          buf=f.read(MIB)
                          if not buf:break
                          h.update(buf)
                      last=os.fstat(f.fileno())
                      if (last.st_size,last.st_mtime_ns,last.st_ino)!=(old.st_size,old.st_mtime_ns,old.st_ino): return None
                  return h.hexdigest()
              except (OSError,ValueError): return None
          
          def main():
              p=argparse.ArgumentParser()
              p.add_argument('--root',type=Path,required=True)
              p.add_argument('--diagnostics',type=Path,required=True)
              p.add_argument('--mode',choices=['off','probe','adaptive'],required=True)
              p.add_argument('--age-minutes',type=int,default=20)
              p.add_argument('--hash-gib',type=float,default=3)
              p.add_argument('--max-files',type=int,default=350)
              p.add_argument('--zip-samples',type=int,default=40)
              p.add_argument('--backing',type=Path,default=Path('/tmp/los20-workspace-btrfs.img'))
              p.add_argument('--min-host-gib',type=float,default=9)
              a=p.parse_args()
              out=a.diagnostics;out.mkdir(parents=True,exist_ok=True)
              state_path=out/'jar-dedupe-state.json'
              summary_file=out/'jar-dedupe-runs.tsv'
              if not summary_file.exists():
                  summary_file.write_text('timestamp\tmode\tfs\tjar_count\tjar_total_bytes\tstable_count\tsame_size_candidate_upper_bytes\tsha_hashed_bytes\tsha_hashed_files\tverified_duplicate_files\tverified_duplicate_bytes\tselected_for_dedupe_bytes\tduperemove_rc\thost_free_before\thost_free_after\tbacking_blocks_before\tbacking_blocks_after\tnote\n')
              if a.mode=='off':return 0
              if not a.root.is_dir():
                  print('JAR_DEDUPE_SKIP: no Soong intermediates');return 0
              fs=subprocess.run(['stat','-f','-c','%T',str(a.root)],capture_output=True,text=True,check=False).stdout.strip()
              state={}
              if state_path.exists():
                  try:state=json.loads(state_path.read_text())
                  except (ValueError,OSError):pass
              promoted=bool(state.get('promoted'))
              byte_budget=int(a.hash_gib*GIB*(2 if promoted else 1))
              before=host_free(); backing_before=physical(a.backing)
              by_size, (total,count,stable_total,stable_count)=census(a.root,128*1024,128*MIB,a.age_minutes*60)
              groups=[(size,entries) for size,entries in by_size.items() if len(entries)>1]
              candidates=sum(size*(len(entries)-1) for size,entries in groups)
              # Prioritize maximum possible savings per candidate reading cost.
              groups.sort(key=lambda g:(g[0]*(len(g[1])-1),g[0]),reverse=True)
              inventory=[(size,len(entries),size*(len(entries)-1)) for size,entries in groups]
              write_tsv(out/'jar-same-size-groups.tsv',('jar_size','files','unverified_upper_bound_bytes'),inventory[:200])
              hashed=0; hashed_count=0
              verified=[]
              duplicate_bytes=0; duplicate_files=0
              for size, entries in groups:
                  if hashed+len(entries)*size>byte_budget or hashed_count+len(entries)>a.max_files:
                      continue
                  digests=collections.defaultdict(list)
                  for path,st in entries:
                      digest=sha256_checked(path,st)
                      if digest is not None:digests[digest].append((path,st))
                      hashed+=size;hashed_count+=1
                  for digest,same in digests.items():
                      if len(same)<2:continue
                      verified.append((size,digest,same))
                      duplicate_files+=len(same)-1
                      duplicate_bytes+=size*(len(same)-1)
              write_tsv(out/'jar-sha256-duplicates.tsv',('sha256','file_bytes','group_files','logical_duplicate_bytes','paths'),
                        [(d,size,len(same),size*(len(same)-1),' ; '.join(str(x[0].relative_to(a.root)) for x in same)) for size,d,same in verified[:200]])
              zip_rows=[]
              sample_paths=[]
              for size, entries in sorted(by_size.items(),reverse=True):
                  for path,st in entries:
                      sample_paths.append((size,path))
                      if len(sample_paths)>=a.zip_samples:break
                  if len(sample_paths)>=a.zip_samples:break
              for size,path in sample_paths:
                  try:
                      with zipfile.ZipFile(path) as z:
                          entries=z.infolist()
                          stored=sum(x.file_size for x in entries if x.compress_type==zipfile.ZIP_STORED)
                          compressed=sum(x.compress_size for x in entries if x.compress_type!=zipfile.ZIP_STORED)
                          methods=','.join(map(str,sorted(set(x.compress_type for x in entries))))
                          zip_rows.append((path.relative_to(a.root),size,len(entries),stored,compressed,methods))
                  except (OSError,zipfile.BadZipFile,ValueError):pass
              write_tsv(out/'jar-zip-structure.tsv',('jar','jar_bytes','entries','stored_entry_bytes','compressed_entry_bytes','methods'),zip_rows)
              rc='skip'; selected_bytes=0;note='read_only'
              if a.mode=='adaptive':
                  if fs!='btrfs':note='not_btrfs'
                  elif not shutil.which('duperemove'):note='duperemove_not_installed'
                  elif before<a.min_host_gib*GIB:note='low_host_space_skip_io'
                  elif not verified:note='no_verified_identical_jars_in_sample'
                  else:
                      # Never run against files changed during hashing or young outputs.
                      chosen=[]
                      for size,digest,files in verified:
                          unchanged=[]
                          for path,st in files:
                              try:
                                  curr=path.stat()
                                  if (curr.st_size,curr.st_mtime_ns,curr.st_ino)==(st.st_size,st.st_mtime_ns,st.st_ino):unchanged.append(str(path.resolve()))
                              except OSError:pass
                          if len(unchanged)>=2:chosen.extend(unchanged)
                      selected_bytes=sum(Path(x).stat().st_size for x in chosen)
                      if chosen:
                          args=['duperemove','-d','--io-threads=1','--cpu-threads=1',
                                '--hashfile='+str(out/'jar-duperemove.hash.db')]+chosen
                          # Outer shell controls total wall clock and I/O priority.
                          try:
                              res=subprocess.run(args, stdout=subprocess.PIPE,stderr=subprocess.STDOUT, timeout=90,text=True,errors='replace')
                              rc=str(res.returncode);note='dedupe_completed' if res.returncode==0 else 'duperemove_error'
                              (out/'jar-duperemove-last.log').write_text(res.stdout[-12000:])
                          except subprocess.TimeoutExpired as e:
                              rc='timeout';note='duperemove_timeout'
                      else:note='verified_files_became_active'
              after=host_free();backing_after=physical(a.backing)
              # Concurrent Ninja writes can hide actual savings; record BOTH raw deltas.
              if a.mode=='adaptive' and rc=='0' and (after-before)>=64*MIB:
                  state['promoted']=True
              state['last_run']=timestamp();state['last_note']=note
              state_path.write_text(json.dumps(state,indent=2)+'\n')
              with summary_file.open('a') as f:
                  values=[timestamp(),a.mode,fs,count,total,stable_count,candidates,hashed,hashed_count,duplicate_files,duplicate_bytes,selected_bytes,rc,before,after,backing_before,backing_after,note]
                  f.write('\t'.join(str(v) for v in values)+'\n')
              print(f'JAR_DEDUPE mode={a.mode} fs={fs} jars={count} logical_gib={total/GIB:.2f} same_size_upper_gib={candidates/GIB:.2f} sha_duplicate_gib={duplicate_bytes/GIB:.2f} selected_gib={selected_bytes/GIB:.2f} host_delta_gib={(after-before)/GIB:.2f} backing_delta_gib={(backing_before-backing_after)/GIB:.2f} note={note}')
              return 0
          
          if __name__=='__main__': sys.exit(main())
          PY_JAR_DEDUPE
          python3 -m py_compile /tmp/rbe-test/ci_jar_dedupe.py
          command -v duperemove || true
          echo "JAR_DEDUPE_ANALYZER_READY mode=$JAR_DEDUPE_MODE"

      - name: Configure primary Soong Go runtime and heap telemetry
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rbe-test
          python3 - <<'PYGO'
          import pathlib
          import re
          import subprocess
          import os
          import sys

          go = pathlib.Path('prebuilts/go/linux-x86/bin/go').resolve()
          gofmt = pathlib.Path('prebuilts/go/linux-x86/bin/gofmt').resolve()
          target = pathlib.Path('build/soong/cmd/soong_build/main.go')
          log = pathlib.Path('/tmp/rbe-test/soong-go-runtime-patch.txt')
          if not (target.is_file() and go.is_file() and gofmt.is_file()):
              sys.exit('ERROR: Soong main.go or the Go toolchain is missing')
          version = subprocess.check_output([str(go), 'version'], text=True).strip()
          m = re.search(r'\bgo(\d+)\.(\d+)', version)
          if not m or tuple(map(int, m.groups())) < (1, 19):
              sys.exit('ERROR: Go >=1.19 required for debug.SetMemoryLimit')
          gogc = int(os.environ['SOONG_GOGC'])
          maxprocs = int(os.environ['SOONG_GRAPH_GOMAXPROCS'])
          mem = re.fullmatch(r'(\d+)GiB', os.environ['SOONG_GOMEMLIMIT'])
          if not mem or not (1 <= gogc <= 200 and 1 <= maxprocs <= 16):
              sys.exit('ERROR: invalid GC settings')
          mem_bytes = int(mem.group(1)) * 1024**3
          if not (1024**3 <= mem_bytes <= 64*1024**3):
              sys.exit('ERROR: unreasonable soft memory limit')

          before = target.read_text()
          if before.count('func main() {') != 1 or before.count('import (') != 1:
              sys.exit('ERROR: unexpected Soong main.go layout')
          if 'SOONG_GO_RUNTIME_APPLIED' in before:
              sys.exit('ERROR: Soong main.go is already instrumented')
          for imp in ('runtime', 'runtime/debug'):
              if f'"{imp}"' not in before:
                  before = before.replace('import (', f'import (\n    "{imp}"', 1)

          # Apply tuning after flag.Parse and before expensive graph work.
          # The process is started with an empty environment by design.
          # The exporter samples genuine Go heap, not RSS or VmSwap.
          code = fr"""
          // SOONG_GC_CI_TRIAL: only applies to primary --soong_variables graph.
          func configureSoongGraphRuntimeCI() {{
              graph := false
              for _, arg := range os.Args[1:] {{
                  if arg == "--soong_variables" || arg == "-soong_variables" || strings.HasPrefix(arg, "--soong_variables=") {{
                      graph = true
                      break
                  }}
              }}
              if !graph {{ return }}
              runtime.GOMAXPROCS({maxprocs})
              debug.SetGCPercent({gogc})
              debug.SetMemoryLimit(int64({mem_bytes}))
              fmt.Fprintf(os.Stderr, "SOONG_GO_RUNTIME_APPLIED pid=%d GOGC={gogc} GOMEMLIMIT={mem_bytes}B GOMAXPROCS={maxprocs}\n", os.Getpid())
              out, err := os.OpenFile("/tmp/rbe-test/soong-go-heap.tsv", os.O_CREATE|os.O_APPEND|os.O_WRONLY, 0600)
              if err != nil {{
                  fmt.Fprintf(os.Stderr, "SOONG_GO_TELEMETRY_OPEN_FAILED: %v\n", err)
                  return
              }}
              capture := func() {{
                  var ms runtime.MemStats
                  runtime.ReadMemStats(&ms)
                  fmt.Fprintf(out, "%s\t%d\t%d\t%d\t%d\t%d\t%d\t%d\t%d\n",
                      time.Now().UTC().Format(time.RFC3339), os.Getpid(),
                      ms.HeapAlloc, ms.HeapSys, ms.HeapInuse, ms.HeapReleased,
                      ms.Sys, ms.StackSys, ms.NumGC)
                  out.Sync()
              }}
              capture()
              go func() {{
                  ticker := time.NewTicker(10 * time.Second)
                  defer ticker.Stop()
                  defer out.Close()
                  for range ticker.C {{ capture() }}
              }}()
          }}
          """
          injected = before.replace('func main() {', code + '\nfunc main() {', 1)
          # Configure before parsing/building the graph; flag.Parse is cheap.
          injected = injected.replace('func main() {', 'func main() {\n    configureSoongGraphRuntimeCI()', 1)
          if injected.count('SOONG_GO_RUNTIME_APPLIED') != 1:
              sys.exit('ERROR: failed to inject runtime instrumentation')
          target.write_text(injected)
          subprocess.run([str(gofmt), '-w', str(target)], check=True)
          formatted = target.read_text()
          if formatted.count('SOONG_GO_RUNTIME_APPLIED') != 1:
              sys.exit('ERROR: formatted Go source missing instrumentation')
          log.write_text(f'go_version={version}\nsource={target}\n' +
                         f'GOGC={gogc}\nGOMEMLIMIT={mem_bytes}B\nGOMAXPROCS={maxprocs}\n' +
                         'method=runtime.GOMAXPROCS + debug.SetGCPercent + debug.SetMemoryLimit\n' +
                         'telemetry=/tmp/rbe-test/soong-go-heap.tsv (10 second intervals)\n' +
                         'applies_only_to=primary_graph_with_--soong_variables\n')
          print(log.read_text())
          PYGO

      - name: Install and verify legacy ncurses5 for RenderScript
        working-directory: /home/runner/work/los
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p /tmp/rbe-test
          LOG=/tmp/rbe-test/legacy-ncurses5-check.log
          exec > >(tee "$LOG") 2>&1

          VERSION=6.3-2ubuntu0.3
          BASE=https://security.ubuntu.com/ubuntu/pool/universe/n/ncurses
          PKG_DIR="$RUNNER_TEMP/ncurses5-jammy"
          mkdir -p "$PKG_DIR"
          # SHA256 hashes published by Ubuntu for the amd64 .deb files.
          NCURSES_SHA=58da01991712c6856af0658dc5e9cb533c1a6854ab950055ade185e35bc9c276
          TINFO_SHA=4df4288404108f1a156d014e8764a064e977e34e6d44931ab60451694c03c90d

          for pkg in libtinfo5 libncurses5; do
            file="${pkg}_${VERSION}_amd64.deb"
            curl --fail --location --show-error --silent \
              --retry 3 --connect-timeout 15 --max-time 90 \
              "$BASE/$file" -o "$PKG_DIR/$file"
            test "$(dpkg-deb -f "$PKG_DIR/$file" Package)" = "$pkg"
            test "$(dpkg-deb -f "$PKG_DIR/$file" Version)" = "$VERSION"
            test "$(dpkg-deb -f "$PKG_DIR/$file" Architecture)" = amd64
          done
          printf '%s  %s\n' \
            "$TINFO_SHA" "$PKG_DIR/libtinfo5_${VERSION}_amd64.deb" \
            "$NCURSES_SHA" "$PKG_DIR/libncurses5_${VERSION}_amd64.deb" \
            | sha256sum --check --status
          echo '=== SHA256 checks passed (Ubuntu Jammy security) ==='

          sudo dpkg -i \
            "$PKG_DIR/libtinfo5_${VERSION}_amd64.deb" \
            "$PKG_DIR/libncurses5_${VERSION}_amd64.deb"
          sudo ldconfig
          ldconfig -p | grep -F 'libtinfo.so.5'
          ldconfig -p | grep -F 'libncurses.so.5'
          echo '=== LEGACY RENDERSCRIPT CLANG DEPENDENCIES ==='
          CLANG=prebuilts/clang/host/linux-x86/clang-3289846/bin/clang.real
          if [ ! -x "$CLANG" ]; then
            echo "::error::Expected legacy RenderScript Clang missing: $CLANG"
            exit 1
          fi
          ldd "$CLANG" | tee /tmp/rbe-test/legacy-clang-ldd.txt
          if grep -q 'not found' /tmp/rbe-test/legacy-clang-ldd.txt; then
            echo '::error::Legacy RenderScript Clang still has unresolved shared libraries.'
            exit 1
          fi
          "$CLANG" --version
          echo '=== LEGACY RENDERSCRIPT CLANG PREFLIGHT PASSED ==='

      - name: Install pinned AOSP reclient 0.172 with matching Clang scanner
        working-directory: /home/runner/work/los
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          # AOSP platform/prebuilts/remoteexecution-client, 2025-03-07.
          # This commit's live/ snapshot is version 0.172.0.3cf60ba5.
          PINNED_COMMIT="943a1532c17256a37eb6d90cdba450ff761b36d1"
          PINNED_VERSION="0.172.0.3cf60ba5"
          PINNED_TREE="live"
          DEST="prebuilts/remoteexecution-client/compat-${PINNED_VERSION}"
          FETCH_DIR="$RUNNER_TEMP/reclient-pinned"

          mkdir -p "$FETCH_DIR" "$DEST" /tmp/rbe-test
          git -C "$FETCH_DIR" init -q
          git -C "$FETCH_DIR" remote add origin \
            https://android.googlesource.com/platform/prebuilts/remoteexecution-client
          git -C "$FETCH_DIR" config core.sparseCheckout true
          printf '%s\n' "/${PINNED_TREE}/" > "$FETCH_DIR/.git/info/sparse-checkout"
          echo "=== FETCH PINNED RECLIENT ==="
          git -C "$FETCH_DIR" -c protocol.version=2 fetch --depth=1 \
            --filter=blob:none origin "$PINNED_COMMIT"
          git -C "$FETCH_DIR" checkout -q --detach FETCH_HEAD
          test "$(git -C "$FETCH_DIR" rev-parse HEAD)" = "$PINNED_COMMIT"

          # Do not use a moving "live" name at runtime. Copy this commit's
          # immutable live/ snapshot into a version-specific standalone path.
          test -d "$FETCH_DIR/$PINNED_TREE"
          test -s "$FETCH_DIR/$PINNED_TREE/version.txt"
          actual_version="$(tr -d '\r\n' < "$FETCH_DIR/$PINNED_TREE/version.txt")"
          if [ "$actual_version" != "$PINNED_VERSION" ]; then
            echo "::error::Pinned AOSP snapshot version mismatch: $actual_version"
            exit 1
          fi
          cp -a "$FETCH_DIR/$PINNED_TREE/." "$DEST/"
          for bin in rewrapper reproxy bootstrap scandeps_server; do
            test -s "$DEST/$bin" || { echo "::error::Missing reclient component: $bin"; exit 1; }
            test -x "$DEST/$bin" || chmod 0755 "$DEST/$bin"
          done
          test "$(tr -d '\r\n' < "$DEST/version.txt")" = "$PINNED_VERSION"
          # Record hashes for reproducibility without embedding opaque binary
          # checksums tied to a different AOSP revision.
          ( cd "$DEST" && sha256sum rewrapper reproxy bootstrap scandeps_server version.txt ) \
            | tee /tmp/rbe-test/reclient-sha256.txt
          # P0.2: register Soong host tool after trimming the original project.
          # ART run-test genrules use tools: ["rewrapper"] and need an Android.bp
          # module, even when the standalone rewrapper executable exists.
          # Restore ONLY this tiny module, not the multi-version project checkout.
          RBE_BP="prebuilts/remoteexecution-client/Android.bp"
          if [ -e "$RBE_BP" ]; then
            echo "::error::Unexpected existing Android.bp: $RBE_BP; refusing to overwrite it."
            exit 1
          fi
          cat > "$RBE_BP" <<EOFRBE_BP
          // Lightweight Soong registration for the separately pinned AOSP reclient.
          prebuilt_build_tool {
              name: "rewrapper",
              src: "compat-${PINNED_VERSION}/rewrapper",
          }
          EOFRBE_BP
          test -s "$RBE_BP"
          test -x "$DEST/rewrapper"
          echo '=== SOONG REWRAPPER MODULE REGISTRATION ==='
          cat "$RBE_BP" | tee /tmp/rbe-test/rewrapper-Android.bp.txt

          # The one-time shallow/sparse clone is no longer needed during build.
          rm -rf "$FETCH_DIR"

          echo '=== P0 PINNED RECLIENT STORAGE ==='
          du -sh "$DEST" prebuilts/remoteexecution-client 2>/dev/null \
            | tee /tmp/rbe-test/p0-reclient-size.txt
          if [ -e prebuilts/remoteexecution-client/live ]; then
            echo '::error::Unexpected repo-synced reclient/live directory; P0 trim was bypassed.'
            exit 1
          fi
          printf '%s\t%s\t%s\t%s\t%s\n' \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" 'post-pinned-reclient' \
            "$(df -B1 --output=avail "$PWD" | tail -n1 | tr -d ' ')" \
            "$(df -B1 --output=used "$PWD" | tail -n1 | tr -d ' ')" \
            "$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)" \
            >> /tmp/rbe-test/resource-samples.tsv

          printf 'pinned_commit=%s\npinned_version=%s\npinned_source_tree=%s\ndepsscanner_address=execrel://\n' \
            "$PINNED_COMMIT" "$PINNED_VERSION" "$PINNED_TREE" \
            > /tmp/rbe-test/reclient-version.txt
          echo "RBE_DIR=$DEST" >> "$GITHUB_ENV"
          # Soong remoteexec defaults to live/rewrapper, which we trimmed.
          # Force the same pinned executable for C/C++ RBE actions.
          echo "RBE_WRAPPER=$DEST/rewrapper" >> "$GITHUB_ENV"
          echo "=== RECLIENT VERSION ==="
          "$DEST/rewrapper" --version 2>&1 | tee -a /tmp/rbe-test/reclient-version.txt || true
          "$DEST/reproxy" --version 2>&1 | tee -a /tmp/rbe-test/reclient-version.txt || true
          test -x "$DEST/bootstrap"

