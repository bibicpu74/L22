          test "${RBE_depsscanner_address:-}" = 'execrel://'
          echo "scanner=$RBE_DIR/scandeps_server"
          echo "scanner_address=$RBE_depsscanner_address"
          # Standalone scanner may be a static binary (ldd exits nonzero);
          # missing shared libraries remain a hard failure.
          ( ldd "$RBE_DIR/scandeps_server" 2>&1 || true ) \
            | tee /tmp/rbe-test/reclient-scanner-ldd.txt
          if grep -q 'not found' /tmp/rbe-test/reclient-scanner-ldd.txt; then
            echo '::error::Standalone Clang dependency scanner has missing shared libraries.'
            exit 1
          fi
          echo "=== CLANG 18 FLAG COMPATIBILITY PREFLIGHT ==="
          CLANG_CPP=prebuilts/clang/host/linux-x86/clang-r510928/bin/clang++
          test -x "$CLANG_CPP"
          {
            "$CLANG_CPP" --version
            printf 'int main() { int x = 0; return x; }\n' \
              | "$CLANG_CPP" -x c++ -std=c++17 -g -gz=zstd \
                  -ftrivial-auto-var-init=zero -c - \
                  -o /tmp/rbe-test/clang18-flags-preflight.o
            test -s /tmp/rbe-test/clang18-flags-preflight.o
            stat -c 'clang_smoke_object_bytes=%s' \
              /tmp/rbe-test/clang18-flags-preflight.o
          } > /tmp/rbe-test/clang18-flags-preflight.log 2>&1 || {
            cat /tmp/rbe-test/clang18-flags-preflight.log
            echo '::error::Checked-out Clang toolchain did not accept required flags.'
            exit 1
          }
          cat /tmp/rbe-test/clang18-flags-preflight.log
          # The real remote dependency-scanner proof follows after graph
          # generation in the existing remote-only libbase smoke stage.

          echo "=== REPROXY VERSION ==="
          "$RBE_DIR/reproxy" --version || true

          echo "=== REWRAPPER VERSION ==="
          "$RBE_DIR/rewrapper" --version || true

          echo "=== BOOTSTRAP VERSION ==="
          "$RBE_DIR/bootstrap" --version || true

      # Reclient 0.172 ClangScanDeps has a reproducible preprocessor parsing
      # failure on two Sonivox .s inputs. Keep remote-only compilation for all
      # other actions; execute these exact two ARM assembly sources locally.
      # Preflight Clang -E is not a substitute for real compiler smoke below.
      - name: Route only two Sonivox ARM assembly actions around RBE scanner
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RBE_DIR:-}"
          WRAPPER="$RBE_DIR/rewrapper"
          REAL="$RBE_DIR/rewrapper.remote-original"
          test -x "$WRAPPER"
          test ! -e "$REAL"
          mv -- "$WRAPPER" "$REAL"
          cat > "$WRAPPER" <<'SONIVOX_REWRAPPER'
          #!/usr/bin/env bash
          set -euo pipefail
          SELF_DIR="$(cd -- "$(dirname -- "$0")" && pwd -P)"
          REAL="$SELF_DIR/rewrapper.remote-original"
          # Match *only* these two Sonivox sources.  All other calls go to
          # pinned reclient unchanged, including --version and normal C/C++.
          matched=''
          for arg in "$@"; do
            case "$arg" in
              external/sonivox/arm-wt-22k/lib_src/ARM-E_filter_gnu.s|*/external/sonivox/arm-wt-22k/lib_src/ARM-E_filter_gnu.s)
                matched=ARM-E_filter_gnu.s ;;
              external/sonivox/arm-wt-22k/lib_src/ARM-E_mastergain_gnu.s|*/external/sonivox/arm-wt-22k/lib_src/ARM-E_mastergain_gnu.s)
                matched=ARM-E_mastergain_gnu.s ;;
            esac
          done
          if [[ -z "$matched" ]]; then
            exec "$REAL" "$@"
          fi
          # Find the exact pinned clang executable in the command handed to
          # rewrapper.  Do not parse compiler flags as rewrapper flags.
          argv=("$@")
          idx=0
          while (( idx < ${#argv[@]} )); do
            case "${argv[$idx]}" in
              prebuilts/clang/host/linux-x86/*/bin/clang|prebuilts/clang/host/linux-x86/*/bin/clang|prebuilts/clang/host/linux-x86/*/bin/clang++)
                break ;;
            esac
            idx=$((idx + 1))
          done
          if (( idx >= ${#argv[@]} )); then
            echo "SONIVOX_ASM_LOCAL_ERROR no pinned clang command found: $matched" >&2
            exit 86
          fi
          compiler="${argv[$idx]}"
          if [[ ! -x "$compiler" ]]; then
            echo "SONIVOX_ASM_LOCAL_ERROR compiler not executable: $compiler" >&2
            exit 86
          fi
          echo "SONIVOX_ASM_LOCAL_COMPILE: $matched using $compiler" >&2
          printf '%s\t%s\t%s\n' "$(date -u +%FT%TZ)" "$matched" "$compiler" \
            >> /tmp/rbe-test/sonivox-local-assembly.tsv
          exec "${argv[@]:idx}"
          SONIVOX_REWRAPPER
          chmod 0755 "$WRAPPER"
          test -x "$REAL"
          test -x "$WRAPPER"
          "$WRAPPER" --version > /tmp/rbe-test/sonivox-wrapper-version.txt 2>&1 || true
          {
            echo 'mode=local-only-exact-sonivox-arm-assembly'
            echo "rewrapper_shim=$WRAPPER"
            echo "pinned_original=$REAL"
            echo 'sources=ARM-E_filter_gnu.s,ARM-E_mastergain_gnu.s'
            echo 'other_actions=unchanged-reclient-remote-only'
          } | tee /tmp/rbe-test/sonivox-assembly-fallback.txt

      - name: Check BuildBuddy network connectivity
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set -e

          echo "=== DNS ==="
          getent hosts remote.buildbuddy.io

          echo "=== TCP 443 ==="
          timeout 15 bash -c 'cat < /dev/null > /dev/tcp/remote.buildbuddy.io/443'

          echo "BuildBuddy TCP endpoint is reachable."

          echo "=== BUILD BUDDY TLS CHAIN DIAGNOSTIC ==="
          TLS_LOG="/tmp/rbe-test/buildbuddy-tls-check.log"
          mkdir -p /tmp/rbe-test
          if ! timeout 20 openssl s_client \
            -connect remote.buildbuddy.io:443 \
            -servername remote.buildbuddy.io \
            -verify_hostname remote.buildbuddy.io \
            -verify_return_error \
            -CAfile /etc/ssl/certs/ca-certificates.crt \
            </dev/null > "$TLS_LOG" 2>&1; then
            echo "::warning::OpenSSL certificate precheck returned an error; see artifact."
          fi
          grep -E 'Verification:|Verify return code:|verify error:|Verification error:|^subject=|^issuer=' "$TLS_LOG" | tail -30 || true

          echo "Authentication will be validated by the real reclient compile below."

      - name: Start authenticated BuildBuddy gRPC bridge
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set -euo pipefail

          # This is needed for Android 11's old reclient which cannot attach
          # custom gRPC metadata. The only cleartext hop is loopback.
          BRIDGE_DIR="/tmp/buildbuddy-rbe-bridge"
          install -d -m 700 "$BRIDGE_DIR" /tmp/rbe-test
          umask 077

          # Never write the secret into workflow logs, a command argument,
          # or the uploaded /tmp/rbe-test artifact directory.
          python3 - <<'PYBRIDGE'
          import os
          from pathlib import Path

          secret = os.environ['BUILDBUDDY_API_KEY']
          if not secret or any(ch in secret for ch in ('\n', '\r', '\x00')):
              raise SystemExit('Invalid BuildBuddy API key format')

          # Escape an nginx double-quoted string safely.
          encoded = secret.replace('\\', '\\\\').replace('"', '\\"')
          config = '''worker_processes 1;
          pid /tmp/buildbuddy-rbe-bridge/nginx.pid;
          error_log /tmp/rbe-test/buildbuddy-grpc-errors.log warn;
          events { worker_connections 1024; }
          http {
            access_log off;
            client_max_body_size 0;
            server {
              listen 127.0.0.1:19099 http2;
              server_name localhost;
              location / {
                grpc_pass grpcs://remote.buildbuddy.io:443;
                grpc_ssl_server_name on;
                grpc_ssl_name remote.buildbuddy.io;
                grpc_ssl_verify on;
                # Android 11 bridge: allow intermediate CAs in the TLS chain.
                grpc_ssl_verify_depth 5;
                grpc_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
                grpc_connect_timeout 30s;
                grpc_read_timeout 300s;
                grpc_send_timeout 300s;
                grpc_set_header x-buildbuddy-api-key "__BUILDBUDDY_KEY__";
              }
            }
          }
          '''.replace('__BUILDBUDDY_KEY__', encoded)
          Path('/tmp/buildbuddy-rbe-bridge/nginx.conf').write_text(config)
          PYBRIDGE

          nginx -t -c "$BRIDGE_DIR/nginx.conf"
          nginx -c "$BRIDGE_DIR/nginx.conf"
          for _ in $(seq 1 20); do
            if (echo > /dev/tcp/127.0.0.1/19099) >/dev/null 2>&1; then
              echo "BuildBuddy local gRPC bridge is listening on 127.0.0.1:19099."
              exit 0
            fi
            sleep 1
          done
          echo "::error::BuildBuddy gRPC bridge failed to start."
          exit 1

      - name: Configure hybrid ZRAM and disk swap for Soong graph
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rbe-test
          umask 077
          ZRAM_STATUS=/tmp/rbe-test/zram-status.txt
          DISK_STATUS=/tmp/rbe-test/swap-status.txt
          ZRAM_DEVICE_FILE=/tmp/rbe-test/zram-device.txt
          BASE_SWAP=/mnt/soong-swap-base
          GRAPH_SWAP=/mnt/soong-swap-graph
          BASE_GIB="${POST_GRAPH_DISK_SWAP_GIB}"
          GIB=1073741824
          : > "$ZRAM_STATUS"
          : > "$DISK_STATUS"
          rm -f "$ZRAM_DEVICE_FILE"

          # A dedicated new device only: do not reset or alter existing swap.
          echo '=== ZRAM CAPABILITY / SETUP ==='
          if ! command -v zramctl >/dev/null 2>&1; then
            printf 'status=unavailable\nreason=zramctl-not-installed\n' > "$ZRAM_STATUS"
          else
            # It may already be built into the kernel; modprobe failure is not fatal.
            sudo modprobe zram num_devices=1 2>>/tmp/rbe-test/zram-setup-errors.log || true
            zram_dev=''
            # lz4 tends to minimize CPU overhead; use kernel default if absent.
            if zram_dev="$(sudo zramctl --find --size "${SOONG_ZRAM_GIB}G" --algorithm zstd 2>>/tmp/rbe-test/zram-setup-errors.log)"; then
              zram_algorithm=zstd
            elif zram_dev="$(sudo zramctl --find --size "${SOONG_ZRAM_GIB}G" 2>>/tmp/rbe-test/zram-setup-errors.log)"; then
              zram_algorithm=kernel-default
            else
              zram_dev=''
              zram_algorithm=unavailable
            fi
            if [ -n "$zram_dev" ] && [ -b "$zram_dev" ] \
               && sudo mkswap -f "$zram_dev" >/dev/null 2>>/tmp/rbe-test/zram-setup-errors.log \
               && sudo swapon --priority 100 "$zram_dev" 2>>/tmp/rbe-test/zram-setup-errors.log; then
              printf '%s\n' "$zram_dev" > "$ZRAM_DEVICE_FILE"
              printf 'status=enabled\ndevice=%s\nsize_gib=%s\nalgorithm=%s\npriority=100\n' \
                "$zram_dev" "$SOONG_ZRAM_GIB" "$zram_algorithm" > "$ZRAM_STATUS"
              echo "ZRAM activated: $zram_dev size=${SOONG_ZRAM_GIB}GiB algorithm=$zram_algorithm priority=100"
            else
              printf 'status=unavailable\nreason=kernel-or-activation-error\n' > "$ZRAM_STATUS"
              if [ -n "$zram_dev" ]; then
                sudo swapoff "$zram_dev" >/dev/null 2>&1 || true
                # Only reset if not registered as active swap.
                if ! swapon --noheadings --show=NAME | grep -Fxq "$zram_dev"; then
                  sudo zramctl --reset "$zram_dev" >/dev/null 2>&1 || true
                fi
              fi
              echo '::warning::ZRAM unavailable; continuing with disk swap fallback.'
            fi
          fi

          # Disk-swap layout: 4-GiB baseline + 8-GiB graph-only extension.
          # Higher priority on baseline ensures graph-only file is used last,
          # improving the chance it is empty after the Soong process exits.
          # Never allocate below the reserved free-space floor.
          echo '=== DISK SWAP SIZING ==='
          disk_free_bytes="$(df -B1 --output=avail /mnt | tail -n1 | tr -d ' ')"
          disk_free_gib=$((disk_free_bytes / GIB))
          reserve_gib="${SOONG_SWAP_DISK_RESERVE_GIB}"
          target_gib="${SOONG_DISK_SWAP_GIB}"
          if (( disk_free_bytes < (target_gib + reserve_gib) * GIB )); then
            # A smaller fallback still respects the same reserve.
            target_gib=$((disk_free_gib - reserve_gib))
            if (( target_gib > SOONG_DISK_SWAP_GIB )); then target_gib="$SOONG_DISK_SWAP_GIB"; fi
          fi
          if (( target_gib < BASE_GIB )); then
            echo "::warning::Not enough disk for even ${BASE_GIB}GiB swap with ${reserve_gib}GiB reserve."
            target_gib=0
          fi
          printf 'status=disabled\ndisk_free_before_gib=%s\nrequested_gib=%s\nallocated_gib=0\nreserve_gib=%s\n' \
            "$disk_free_gib" "$SOONG_DISK_SWAP_GIB" "$reserve_gib" > "$DISK_STATUS"
          allocate_swap() {
            local path="$1" size_gib="$2" priority="$3"
            if ! sudo fallocate -l "${size_gib}G" "$path"; then
              sudo rm -f "$path" || true
              return 1
            fi
            sudo chmod 600 "$path"
            if sudo mkswap "$path" >/dev/null && sudo swapon --priority "$priority" "$path"; then
              echo "SWAP_ON path=$path size_gib=$size_gib priority=$priority"
              return 0
            fi
            sudo swapoff "$path" >/dev/null 2>&1 || true
            sudo rm -f "$path" || true
            return 1
          }
          allocated=0
          if (( target_gib >= BASE_GIB )); then
            if allocate_swap "$BASE_SWAP" "$BASE_GIB" 20; then
              allocated="$BASE_GIB"
              graph_gib=$((target_gib - BASE_GIB))
              if (( graph_gib > 0 )); then
                if allocate_swap "$GRAPH_SWAP" "$graph_gib" 10; then
                  allocated=$((allocated + graph_gib))
                else
                  echo '::warning::Graph-only swap allocation failed, base swap still enabled.'
                fi
              fi
            else
              echo '::warning::Baseline disk swap allocation failed.'
            fi
          fi
          printf 'status=%s\ndisk_free_before_gib=%s\nrequested_gib=%s\nallocated_gib=%s\nreserve_gib=%s\nbase_gib=%s\n' \
            "$( (( allocated > 0 )) && echo enabled || echo disabled)" \
            "$disk_free_gib" "$SOONG_DISK_SWAP_GIB" "$allocated" "$reserve_gib" "$BASE_GIB" \
            > "$DISK_STATUS"
          if (( allocated < SOONG_DISK_SWAP_GIB )); then
            echo "::warning::Disk swap available ${allocated}/${SOONG_DISK_SWAP_GIB} GiB (disk-reserve safeguard)."
          fi
          echo '=== ACTIVE HYBRID SWAP ==='
          cat "$ZRAM_STATUS" "$DISK_STATUS"
          swapon --show=NAME,TYPE,SIZE,USED,PRIO || true
          zramctl || true
          free -h
          df -h /mnt /home/runner/work/los
          # Failing to activate any swap is not a successful 15-GiB trial.
          if ! swapon --noheadings --show=NAME | grep -q .; then
            echo '::error::No active swap device; aborting before the known Soong memory peak.'
            exit 1
          fi

      - name: Configure Lineage and build full star2lte ROM via BuildBuddy
        working-directory: /home/runner/work/los
        # The 320-minute job-clock guard below leaves time for cleanup/upload.
        timeout-minutes: 360
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p /tmp/rbe-test

          # P0.1: capture early setup output, even when envsetup or lunch fails
          # before m-nothing.log / rbe-env.txt can be created.
          # Preserve Actions stdout/stderr to avoid duplicating long build logs.
          exec 3>&1 4>&2
          exec > >(tee -a /tmp/rbe-test/configure-setup.log) 2>&1
          CURRENT_STAGE=configure-start
          LAST_FAILURE_LINE=''
          LAST_FAILURE_COMMAND=''
          BUILD_PID=''
          mark_stage() {
            CURRENT_STAGE="$1"
            printf '[%s] STAGE: %s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$CURRENT_STAGE" \
              | tee -a /tmp/rbe-test/configure-stages.log
          }
          on_error() {
            LAST_FAILURE_LINE="$1"
            LAST_FAILURE_COMMAND="$2"
            # Never enable set -x: BuildBuddy credentials are in the environment.
            printf 'Failure observed at line=%s in stage=%s\n' "$LAST_FAILURE_LINE" "$CURRENT_STAGE" >&2
          }
          on_exit() {
            local rc=$?
            trap - EXIT
            # Retain the original process-tree cleanup if build is interrupted.
            if [ -n "${BUILD_PID:-}" ] && kill -0 "$BUILD_PID" 2>/dev/null; then
              if declare -F stop_process_tree >/dev/null; then
                stop_process_tree "$BUILD_PID" || true
              fi
            fi
            if [ "$rc" -ne 0 ]; then
              {
                printf 'exit_code=%s\n' "$rc"
                printf 'stage=%s\n' "$CURRENT_STAGE"
                printf 'error_line=%s\n' "${LAST_FAILURE_LINE:-unavailable}"
                printf 'error_command=%s\n' "${LAST_FAILURE_COMMAND:-unavailable}"
                printf 'timestamp=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              } > /tmp/rbe-test/configure-failure.txt
              echo "::error::Configure failed: stage=$CURRENT_STAGE exit=$rc line=${LAST_FAILURE_LINE:-unknown}"
              echo '=== FAILURE DISK / MEMORY SNAPSHOT ==='
              df -h /home/runner/work/los || true
              free -h || true
              du -sh out 2>/dev/null || true
            else
              printf 'exit_code=0\nstage=%s\n' "$CURRENT_STAGE" \
                > /tmp/rbe-test/configure-success.txt
            fi
          }
          on_signal() {
            local signal="$1" rc="$2"
            trap - TERM INT
            printf 'signal=%s\nstage=%s\ntimestamp=%s\nrun_id=%s\nattempt=%s\n' \
              "$signal" "$CURRENT_STAGE" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
              "${GITHUB_RUN_ID:-unknown}" "${GITHUB_RUN_ATTEMPT:-unknown}" \
              > /tmp/rbe-test/termination-signal.txt
            {
              echo '=== SIGNAL MEMORY SNAPSHOT ==='
              free -h
              swapon --show || true
              ps -eo pid,ppid,rss,stat,comm --sort=-rss | head -n 18 || true
              if [ -r /sys/fs/cgroup/memory.events ]; then
                echo '=== MEMORY CGROUP EVENTS ==='
                cat /sys/fs/cgroup/memory.events
              fi
              grep -E '^(oom_kill|pswpin|pswpout) ' /proc/vmstat || true
              if declare -F record_memory_pressure >/dev/null; then
                record_memory_pressure "signal-$signal" || true
              fi
            } >> /tmp/rbe-test/memory-pressure.log 2>&1
            echo "::error::Received $signal during $CURRENT_STAGE; SIGTERM alone cannot distinguish cancellation from resource pressure." >&2
            exit "$rc"
          }
          trap 'on_error "$LINENO" "$BASH_COMMAND"' ERR
          trap 'on_signal TERM 143' TERM
          trap 'on_signal INT 130' INT
          trap on_exit EXIT
          mark_stage configure-start

          echo "=== DATE / OS / SHELL ==="
          date -u +'%Y-%m-%dT%H:%M:%SZ'
          pwd -P
          bash --version | head -1
          echo "=== JAVA CANDIDATES (NO OVERRIDE YET) ==="
          command -v java || true
          java -version 2>&1 || true
          ls -ld prebuilts/jdk/jdk11/linux-x86 prebuilts/jdk/jdk17/linux-x86 \
            2>/dev/null || true

          # LineageOS 21.0 / Android 14 requires PRODUCT-RELEASE-VARIANT.
          # Release "ap2a" comes from build/release/release_config_map.mk.
          if [ ! -f build/envsetup.sh ]; then
            echo "::error::Missing build/envsetup.sh; check repo sync and working-directory."
            exit 1
          fi
          # Android envsetup/lunch are designed to run in an interactive-like
          # shell. Avoid inherited ERR traps changing command-substitution output
          # (previously visible as the bogus ".../Failure observed" filename).
          trap - ERR
          set +e
          mark_stage envsetup
          source build/envsetup.sh
          ENVSETUP_RC=$?
          if [ "$ENVSETUP_RC" -ne 0 ]; then
            echo "::error::envsetup.sh returned $ENVSETUP_RC" >&2
            exit "$ENVSETUP_RC"
          fi
          echo '=== ENVSETUP PASSED ==='
          mark_stage lunch
          export WITHOUT_CHECK_API=true
          lunch lineage_star2lte-ap2a-userdebug
          LUNCH_RC=$?
          # Restore strict error checking only after the Lineage shell setup.
          set -e
          trap 'on_error "$LINENO" "$BASH_COMMAND"' ERR
          if [ "$LUNCH_RC" -ne 0 ]; then
            echo "::error::lunch returned $LUNCH_RC" >&2
            exit "$LUNCH_RC"
          fi
          echo '=== LUNCH PASSED ==='
          mark_stage java-selection

          # Android 14 uses JDK 17. Do not force the older JDK 11 after lunch.
          # Keep the Java variables consistent with the checked-out prebuilt.
          JDK17="$PWD/prebuilts/jdk/jdk17/linux-x86"
          if [ ! -x "$JDK17/bin/java" ]; then
            echo "::error::Bundled JDK 17 is missing: $JDK17/bin/java"
            exit 1
          fi
          export JAVA_HOME="$JDK17"
          export ANDROID_JAVA_HOME="$JDK17"
          export PATH="$JAVA_HOME/bin:$PATH"
          "$JAVA_HOME/bin/java" -version
          export USE_CCACHE=0
          export CCACHE_DISABLE=1
          # The checked-out Go toolchain may be older than Go 1.19.
          # GOMEMLIMIT does not exist on Go 1.18; never claim it worked there.
          export GOGC="$SOONG_GOGC"
          unset GOMEMLIMIT || true
          GO_BIN="$PWD/prebuilts/go/linux-x86/bin/go"
          GO_VERSION='unavailable'
          GO_LIMIT_MODE='unsupported-or-unverified'
          if [ -x "$GO_BIN" ]; then
            GO_VERSION="$("$GO_BIN" version 2>&1 || true)"
            if [[ "$GO_VERSION" =~ go([0-9]+)\.([0-9]+) ]]; then
              GO_MAJOR="${BASH_REMATCH[1]}"
              GO_MINOR="${BASH_REMATCH[2]}"
              if (( GO_MAJOR > 1 || (GO_MAJOR == 1 && GO_MINOR >= 19) )); then
                export GOMEMLIMIT="$SOONG_GOMEMLIMIT"
                GO_LIMIT_MODE='enabled-soft-limit'
              fi
            fi
          fi
          printf 'go_tool=%s\ngo_version=%s\ngogc=%s\ngomemlimit_mode=%s\ngomemlimit_value=%s\n' \
            "$GO_BIN" "$GO_VERSION" "$GOGC" "$GO_LIMIT_MODE" \
            "${GOMEMLIMIT:-disabled}" > /tmp/rbe-test/soong-go-runtime.txt
          cat /tmp/rbe-test/soong-go-runtime.txt
          if [ "$GO_LIMIT_MODE" != 'enabled-soft-limit' ]; then
            echo '::warning::Prebuilt Go is older than 1.19 or unverified: GOMEMLIMIT=6GiB cannot be guaranteed. GOGC=25 is still applied.'
          fi
          echo '=== SWAP ==='
          free -h
          swapon --show || true
          echo "=== JAVA VERSION ==="
          java -version 2>&1 || true

          echo "=== LINEAGE BUILD SELECTION ==="
          echo "ANDROID_BUILD_TOP=${ANDROID_BUILD_TOP:-unset}"
          echo "TARGET_PRODUCT=${TARGET_PRODUCT:-unset}"
          echo "TARGET_RELEASE=${TARGET_RELEASE:-unset}"
          echo "TARGET_BUILD_VARIANT=${TARGET_BUILD_VARIANT:-unset}"
          echo "TARGET_BUILD_TYPE=${TARGET_BUILD_TYPE:-unset}"

          if [ -z "${ANDROID_BUILD_TOP:-}" ] || \
             [ "${TARGET_PRODUCT:-}" != "lineage_star2lte" ] || \
             [ "${TARGET_RELEASE:-}" != "ap2a" ] || \
             [ "${TARGET_BUILD_VARIANT:-}" != "userdebug" ]; then
            echo "::error::Invalid LineageOS build configuration."
            exit 1
          fi

          if [ "$(cd "$ANDROID_BUILD_TOP" && pwd -P)" != "$(pwd -P)" ]; then
            echo "::error::ANDROID_BUILD_TOP does not point at the current source tree."
            exit 1
          fi

          # Keep working_directory non-empty ("los") for BuildBuddy, while
          # upgraded reclient handles output_files relative to that directory.
          export RBE_exec_root="$(dirname "$(pwd -P)")"
          RBE_REL_WORKDIR="$(realpath --relative-to="$RBE_exec_root" "$(pwd -P)")"

          mark_stage rbe-configuration
          # Ensure Soong and ART both resolve the pinned rewrapper, not live/.
          export RBE_WRAPPER="$RBE_DIR/rewrapper"
          test -x "$RBE_WRAPPER"
          test -s prebuilts/remoteexecution-client/Android.bp
          echo "=== RBE WORKING DIRECTORY COMPATIBILITY ==="
          echo "RBE_exec_root=$RBE_exec_root"
          echo "RBE_REL_WORKDIR=$RBE_REL_WORKDIR"
          if [ "$RBE_REL_WORKDIR" != "los" ]; then
            echo "::error::Unexpected RBE working directory: $RBE_REL_WORKDIR"
            exit 1
          fi
          if [ ! -d "$RBE_exec_root/$RBE_REL_WORKDIR/bionic" ]; then
            echo "::error::Android source tree is missing under RBE_exec_root."
            exit 1
          fi
          printf 'RBE_exec_root=%s\nRBE_relative_working_dir=%s\n' \
            "$RBE_exec_root" "$RBE_REL_WORKDIR" \
            > /tmp/rbe-test/rbe-working-directory.txt

          echo "=== EFFECTIVE RBE CONFIG ==="
          {
            echo "USE_RBE=${USE_RBE}"
            echo "RBE_service=${RBE_service}"
            echo "RBE_depsscanner_address=${RBE_depsscanner_address}"
            echo "RBE_service_no_security=${RBE_service_no_security}"
            echo "RBE_DIR=${RBE_DIR}"
            echo "RBE_WRAPPER=${RBE_WRAPPER}"
            echo "RBE_exec_root=${RBE_exec_root}"
            echo "RBE_relative_working_dir=${RBE_REL_WORKDIR}"
            echo "RBE_CXX_EXEC_STRATEGY=${RBE_CXX_EXEC_STRATEGY}"
            echo "RBE_use_application_default_credentials=${RBE_use_application_default_credentials}"
            echo "RBE_use_rpc_credentials=${RBE_use_rpc_credentials}"
            echo "RBE_service_no_auth=${RBE_service_no_auth}"
            echo "BuildBuddy auth=loopback nginx gRPC bridge (TLS upstream)"
            echo "RBE_log_dir=${RBE_log_dir}"
            echo "RBE_log_path=${RBE_log_path}"
            echo "RBE_proxy_log_dir=${RBE_proxy_log_dir}"
            echo "RBE_v=${RBE_v}"
            echo "RBE_output_dir=${RBE_output_dir}"
            echo "NINJA_REMOTE_NUM_JOBS=${NINJA_REMOTE_NUM_JOBS}"
            echo "NINJA_HIGHMEM_NUM_JOBS=${NINJA_HIGHMEM_NUM_JOBS}"
            echo "NINJA_LOCAL_PARALLEL=2"
            echo "WORKSPACE_STORAGE=${WORKSPACE_STORAGE}"
          } | tee /tmp/rbe-test/rbe-env.txt

          # Write stage-specific samples for easy comparison, using bytes
          # instead of the rounded df -h values.
          DISK_SAMPLES=/tmp/rbe-test/resource-samples.tsv
          if [ ! -f "$DISK_SAMPLES" ]; then
            printf 'timestamp\tstage\tdisk_available_bytes\tdisk_used_bytes\tmem_available_kib\n' > "$DISK_SAMPLES"
          fi
          # Btrfs loop-image logical capacity is NOT host free space.
          # Both root and inner Btrfs are checked, and the smaller governs.
          BTRFS_ACTIVE=0
          BTRFS_BACKING=/tmp/los20-workspace-btrfs.img
          if [ "$WORKSPACE_STORAGE" = btrfs_zstd ]; then
            mountpoint -q "$PWD" || { echo '::error::Btrfs mount lost'; exit 70; }
            test "$(stat -f -c '%T' "$PWD")" = btrfs
            test -f "$BTRFS_BACKING"
            BTRFS_ACTIVE=1
          fi
          disk_sample() {
            local stage="$1" root_avail root_used inner_avail available mem alloc blocks bsize
            root_avail="$(df -B1 --output=avail / | tail -n 1 | tr -d ' ')"
            root_used="$(df -B1 --output=used / | tail -n 1 | tr -d ' ')"
            inner_avail="$(df -B1 --output=avail "$PWD" | tail -n 1 | tr -d ' ')"
            available="$root_avail"
            if (( inner_avail < available )); then available="$inner_avail"; fi
            mem="$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)"
            printf '%s\t%s\t%s\t%s\t%s\n' \
              "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$stage" "$available" "$root_used" "$mem" >> "$DISK_SAMPLES"
            if (( BTRFS_ACTIVE == 1 )); then
              read -r blocks bsize < <(stat -c '%b %B' "$BTRFS_BACKING")
              alloc=$((blocks*bsize))
              printf '%s\t%s\t%s\t%s\t%s\n' \
                "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$stage" "$root_avail" "$inner_avail" "$alloc" \
                >> /tmp/rbe-test/btrfs-storage-samples.tsv
            fi
            printf '%s\n' "$available"
          }
          enforce_initial_disk_guard() {
            local stage="$1" available threshold
            available="$(disk_sample "$stage")"
            threshold=$((DISK_STOP_GIB * 1024 * 1024 * 1024))
            if (( available < threshold )); then
              echo "::error::Root/Btrfs available below ${DISK_STOP_GIB} GiB at ${stage}."
              df -h / "$PWD"
              exit 70
            fi
            echo "=== DISK AT ${stage}: $((available / 1073741824)) GiB physical-safe free ==="
          }
          # The 320-minute deadline is measured from post-reclaim, not from
          # the start of bacon. Supervise Soong graph generation as well.
          if [ -s /tmp/rbe-test/job-start-epoch.txt ]; then
            JOB_START_EPOCH="$(cat /tmp/rbe-test/job-start-epoch.txt)"
          else
            JOB_START_EPOCH="$(date +%s)"
          fi
          SOFT_DEADLINE_EPOCH=$(( JOB_START_EPOCH + FULL_ROM_SOFT_DEADLINE_MINUTES * 60 ))
          echo "=== WHOLE-JOB SOFT DEADLINE (UTC) ==="
          date -u -d "@$SOFT_DEADLINE_EPOCH" +'%Y-%m-%dT%H:%M:%SZ'
          if (( $(date +%s) >= SOFT_DEADLINE_EPOCH )); then
            echo '::error::Whole-job soft deadline already reached before Soong graph generation.'
            exit 71
          fi

          stop_process_tree() {
            local pid="$1" child
            while IFS= read -r child; do
              [ -n "$child" ] || continue
              stop_process_tree "$child"
            done < <(pgrep -P "$pid" 2>/dev/null || true)
            kill -TERM "$pid" 2>/dev/null || true
          }
          # Identify the current cgroup (GitHub-hosted Ubuntu usually uses v2).
          # Always prefer the process's own cgroup, not host-wide counters.
          CGROUP_MEMORY_DIR=''
          if [ -e /sys/fs/cgroup/cgroup.controllers ]; then
            CGROUP_REL="$(awk -F: '$1=="0" {print $3; exit}' /proc/self/cgroup)"
            if [ -d "/sys/fs/cgroup${CGROUP_REL}" ]; then
              CGROUP_MEMORY_DIR="/sys/fs/cgroup${CGROUP_REL}"
            elif [ -d /sys/fs/cgroup ]; then
              CGROUP_MEMORY_DIR=/sys/fs/cgroup
            fi
          fi
          cgroup_read() {
            local name="$1" file
            file="${CGROUP_MEMORY_DIR}/${name}"
            if [ -n "$CGROUP_MEMORY_DIR" ] && [ -r "$file" ]; then
              cat "$file" 2>/dev/null || printf 'na'
            else
              printf 'na'
            fi
          }
          cgroup_event_value() {
            local name="$1" file
            file="${CGROUP_MEMORY_DIR}/memory.events"
            if [ -n "$CGROUP_MEMORY_DIR" ] && [ -r "$file" ]; then
              awk -v key="$name" '$1==key {print $2; found=1; exit} END {if (!found) print "na"}' "$file"
            else
              printf 'na'
            fi
          }
          # Top RSS processes and Soong's VmRSS/VmHWM/VmSwap identify whether
          # Go/Soong or another host process is consuming the RAM.
          record_memory_pressure() {
            local label="$1" pid
            {
              echo "=== $label $(date -u +'%Y-%m-%dT%H:%M:%SZ') ==="
              free -h
              swapon --show || true
              zramctl 2>/dev/null || true
              if [ -r /tmp/rbe-test/zram-device.txt ]; then
                zram_dev="$(cat /tmp/rbe-test/zram-device.txt)"
                zram_node="${zram_dev##*/}"
                if [ -r "/sys/block/${zram_node}/mm_stat" ]; then
                  echo "--- ZRAM ${zram_node} MM_STAT (orig/compressed/mem_used in bytes) ---"
                  cat "/sys/block/${zram_node}/mm_stat"
                fi
              fi
              echo '--- TOP RSS (KiB; command names only; no args or secrets) ---'
              ps -eo pid,ppid,rss,stat,comm --sort=-rss | head -n 18 || true
              echo '--- SOONG BUILD PROCESS DETAILS ---'
              while IFS= read -r pid; do
                [ -n "$pid" ] || continue
                echo "pid=$pid"
                grep -E '^(Name|State|VmRSS|VmHWM|VmSwap|VmSize|Threads):' \
                  "/proc/$pid/status" 2>/dev/null || true
                if [ -r "/proc/$pid/smaps_rollup" ]; then
                  # smaps_rollup may stall heavily when disk swap is saturated.
                  timeout 3s grep -E '^(Rss|Pss|Swap|Private_Dirty):' \
                    "/proc/$pid/smaps_rollup" 2>/dev/null || true
                fi
              done < <(pgrep -x soong_build 2>/dev/null || true)
              echo '--- CGROUP V2 MEMORY ---'
              echo "cgroup_memory_dir=${CGROUP_MEMORY_DIR:-not-available}"
              for metric in memory.current memory.peak memory.max memory.swap.current \
                            memory.swap.peak memory.swap.max memory.events memory.events.local; do
                printf '%s: ' "$metric"
                if [[ "$metric" == *events* ]]; then printf '\n'; fi
                cgroup_read "$metric"
                printf '\n'
              done
              echo '--- PSI / HOST VMSTAT ---'
              [ ! -r /proc/pressure/memory ] || cat /proc/pressure/memory
              grep -E '^(oom_kill|pswpin|pswpout) ' /proc/vmstat || true
            } >> /tmp/rbe-test/memory-pressure.log 2>&1
          }
          # Machine-readable samples preserve last-second state on cancellation.
          SOONG_MEMORY_TSV=/tmp/rbe-test/soong-memory-samples.tsv
          printf 'timestamp\tphase\tmem_available_kib\tswap_free_kib\tsoong_rss_kib\tsoong_hwm_kib\tsoong_swap_kib\tsoong_pids\tcgroup_memory_current_bytes\tcgroup_memory_peak_bytes\tcgroup_swap_current_bytes\tcgroup_swap_peak_bytes\tcgroup_oom\tcgroup_oom_kill\n' \
            > "$SOONG_MEMORY_TSV"
          sample_soong_memory() {
            local phase="$1" pid rss=0 hwm=0 swap=0 pids=0 value
            local mem_avail swap_free
            mem_avail="$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)"
            swap_free="$(awk '/^SwapFree:/ {print $2}' /proc/meminfo)"
            while IFS= read -r pid; do
              [ -n "$pid" ] || continue
              [ -r "/proc/$pid/status" ] || continue
              pids=$((pids + 1))
              value="$(awk '/^VmRSS:/ {print $2}' "/proc/$pid/status" 2>/dev/null)"
              rss=$((rss + ${value:-0}))
              value="$(awk '/^VmHWM:/ {print $2}' "/proc/$pid/status" 2>/dev/null)"
              hwm=$((hwm + ${value:-0}))
              value="$(awk '/^VmSwap:/ {print $2}' "/proc/$pid/status" 2>/dev/null)"
              swap=$((swap + ${value:-0}))
            done < <(pgrep -x soong_build 2>/dev/null || true)
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$phase" "$mem_avail" "$swap_free" \
              "$rss" "$hwm" "$swap" "$pids" \
              "$(cgroup_read memory.current)" "$(cgroup_read memory.peak)" \
              "$(cgroup_read memory.swap.current)" "$(cgroup_read memory.swap.peak)" \
              "$(cgroup_event_value oom)" "$(cgroup_event_value oom_kill)" \
              >> "$SOONG_MEMORY_TSV"
          }
          # P0: optional observation of the actual primary builder environment.
          # Unlike the direct Go runtime API patch, these variables are expected
          # to be absent from the `env -i` command. Never dump all environ.
          SOONG_ENV_OBSERVED=/tmp/rbe-test/soong-proc-environ.tsv
          printf 'timestamp\tpid\tGOGC\tGOMEMLIMIT\tGOMAXPROCS\tGODEBUG\n' > "$SOONG_ENV_OBSERVED"
          ENV_OBSERVED_PIDS=' '
          observe_primary_soong_environment() {
            local pid envtext gc limit procs debug
            while IFS= read -r pid; do
              [ -r "/proc/$pid/status" ] || continue
              if [[ "$ENV_OBSERVED_PIDS" == *" $pid "* ]]; then continue; fi
              if ! grep -aFq -- '--soong_variables' "/proc/$pid/cmdline" 2>/dev/null; then continue; fi
              [ -r "/proc/$pid/environ" ] || continue
              envtext="$(tr '\0' '\n' < "/proc/$pid/environ" 2>/dev/null || true)"
              gc="$(printf '%s\n' "$envtext" | sed -n 's/^GOGC=//p' | head -n1)"
              limit="$(printf '%s\n' "$envtext" | sed -n 's/^GOMEMLIMIT=//p' | head -n1)"
              procs="$(printf '%s\n' "$envtext" | sed -n 's/^GOMAXPROCS=//p' | head -n1)"
              debug="$(printf '%s\n' "$envtext" | sed -n 's/^GODEBUG=//p' | head -n1)"
              printf '%s\t%s\t%s\t%s\t%s\t%s\n' \
                "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$pid" \
                "${gc:-absent}" "${limit:-absent}" "${procs:-absent}" "${debug:-absent}" \
                >> "$SOONG_ENV_OBSERVED"
              ENV_OBSERVED_PIDS="${ENV_OBSERVED_PIDS}${pid} "
            done < <(pgrep -x soong_build 2>/dev/null || true)
          }
          # PID-level CPU information, not the wrapper bash process CPU.
          # %CPU is procps' lifetime-average, not an instantaneous sample.
          SOONG_PROCESS_TSV=/tmp/rbe-test/soong-process-samples.tsv
          printf 'timestamp\tphase\tpid\tppid\tpcpu_pct\tpmem_pct\trss_kib\tvsz_kib\telapsed_seconds\tstat\tcomm\n' \
            > "$SOONG_PROCESS_TSV"
          sample_soong_processes() {
            local phase="$1" pid timestamp
            timestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            while IFS= read -r pid; do
              [ -r "/proc/$pid/status" ] || continue
              ps -p "$pid" -o pid=,ppid=,%cpu=,%mem=,rss=,vsz=,etimes=,stat=,comm= \
                2>/dev/null | awk -v t="$timestamp" -v p="$phase" \
                  'NF>=9 {printf "%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n",t,p,$1,$2,$3,$4,$5,$6,$7,$8,$9}' \
                  >> "$SOONG_PROCESS_TSV" || true
            done < <(pgrep -x soong_build 2>/dev/null || true)
          }
          # Main build log already includes all GC traces (potentially multiple
          # Go processes). Keep a small extract for quick post-mortem analysis.
          SOONG_GC_TAIL=/tmp/rbe-test/soong-gc-trace-tail.log
          extract_soong_gc_tail() {
            local log_file="$1"
            [ -s "$log_file" ] || return 0
            grep -aE '(^|[[:space:]])gc [0-9]+ @' "$log_file" \
              | tail -n "$SOONG_GRAPH_GC_TAIL_LINES" > "$SOONG_GC_TAIL" || true
          }
          : > /tmp/rbe-test/memory-pressure.log
          if [ -n "$CGROUP_MEMORY_DIR" ] && [ -r "$CGROUP_MEMORY_DIR/memory.events" ]; then
            cp "$CGROUP_MEMORY_DIR/memory.events" \
              /tmp/rbe-test/cgroup-memory-events-before-graph.txt || true
          fi
          record_memory_pressure pre-graph
          sample_soong_memory pre-graph
          sample_soong_processes pre-graph

          # Live diagnostics: NEVER truncate a file still opened by reproxy.
          # The glog active INFO fd can otherwise develop sparse holes on writes.
          # Reclaim completed/closed INFO rotations only, and retain tails.
          rbe_prune_closed_info() {
            python3 - "$RBE_CLOSED_INFO_MAX_MIB" "$RBE_INFO_KEEP_MIB" <<'PYPRUNE'
          import os, pathlib, subprocess, sys, time
          root=pathlib.Path('/tmp/rbe-test').resolve()
          if not root.is_dir(): sys.exit(0)
          threshold=int(sys.argv[1])*1048576
          keep=int(sys.argv[2])*1048576
          busy=set()
          # Enumerate just the fds of reproxy, not all processes on the runner.
          try:
              proc=subprocess.run(['pgrep','-x','reproxy'],capture_output=True,text=True,check=False)
              pids=[int(x) for x in proc.stdout.split() if x.isdigit()]
          except Exception: pids=[]
          for pid in pids:
              fddir=pathlib.Path(f'/proc/{pid}/fd')
              try:
                  for fd in fddir.iterdir():
                      try:
                          st=fd.stat()
                          busy.add((st.st_dev,st.st_ino))
                      except OSError: pass
              except OSError: pass
          changed=[]
          for file in root.iterdir():
              if file.is_symlink() or not file.is_file(): continue
              name=file.name
              if not (name.startswith(('reproxy.','bootstrap.','rewrapper.','scandeps_server.')) and
                     ('.INFO.' in name or name.endswith('.INFO'))): continue
              st=file.stat()
              if st.st_size <= threshold or time.time()-st.st_mtime < 120: continue
              if (st.st_dev,st.st_ino) in busy: continue
              # Stale files only: preserve the last 4MiB for debugging.
              tmp=file.with_name(file.name+'.ci-compact')
              try:
                  with file.open('rb') as src, tmp.open('wb') as dst:
                      src.seek(-min(keep,st.st_size),os.SEEK_END)
                      while True:
                          buf=src.read(1048576)
                          if not buf: break
                          dst.write(buf)
                  os.replace(tmp,file)
                  changed.append((name,st.st_size,file.stat().st_size))
              finally:
                  tmp.unlink(missing_ok=True)
          log=root/'rbe-live-info-compaction.tsv'
          if changed:
              with log.open('a') as f:
                  for n,b,a in changed:
                      f.write(f'{time.time():.0f}\t{n}\t{b}\t{a}\n')
              print(f'RBE_CLOSED_INFO_COMPACTED count={len(changed)} bytes_saved={sum(b-a for _,b,a in changed)}')
          PYPRUNE
          }
          # Profiles bytes actually occupying disk, not only logical Btrfs space.
          sample_build_disk_breakdown() {
            local now image_bytes root_free log_bytes
            now="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            root_free="$(df -B1 --output=avail / | tail -n1 | tr -d ' ')"
            image_bytes=0
            if [ -f "$BTRFS_BACKING" ]; then
              read -r blocks bsize < <(stat -c '%b %B' "$BTRFS_BACKING")
              image_bytes=$((blocks*bsize))
            fi
            # du can be expensive on out/ at ~100GiB; run only every ~5 minutes.
            local soong_kib target_kib repo_kib
            soong_kib="$(du -sk out/soong 2>/dev/null | awk '{print $1}')"
            target_kib="$(du -sk out/target 2>/dev/null | awk '{print $1}')"
            repo_kib="$(du -sk .repo 2>/dev/null | awk '{print $1}')"
            log_bytes="$(du -sk "$(readlink -f /tmp/rbe-test)" 2>/dev/null | awk '{print $1*1024}')"
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$now" "$root_free" "$image_bytes" "${soong_kib:-0}" "${target_kib:-0}" "${repo_kib:-0}" >> /tmp/rbe-test/build-storage-breakdown.tsv
            printf '%s\t%s\n' "$now" "${log_bytes:-0}" >> /tmp/rbe-test/rbe-log-size-samples.tsv
            echo "STORAGE_PROFILE root_free_gib=$((root_free/1073741824)) image_gib=$((image_bytes/1073741824)) out_soong_mib=$((${soong_kib:-0}/1024)) out_target_mib=$((${target_kib:-0}/1024)) repo_mib=$((${repo_kib:-0}/1024)) rbe_log_bytes=${log_bytes:-0}"
          }
          printf 'timestamp\troot_available_bytes\timage_physical_bytes\tout_soong_kib\tout_target_kib\trepo_kib\n' > /tmp/rbe-test/build-storage-breakdown.tsv
          printf 'timestamp\trbe_diagnostics_bytes\n' > /tmp/rbe-test/rbe-log-size-samples.tsv

          profile_soong_intermediates() {
            local phase="$1" tag="$2"
            if [ ! -f /tmp/rbe-test/soong_storage_probe.py ]; then return 0; fi
            if [ ! -d out/soong/.intermediates ]; then return 0; fi
            # Run asynchronously so the 10s disk guard is never blocked by a
            # potentially slow scan over hundreds of thousands of entries.
            (
              exec 9>/tmp/rbe-test/soong-storage-profile.lock
              flock -n 9 || exit 0
              timeout "${SOONG_PROFILE_TIMEOUT_SECONDS}s" python3 /tmp/rbe-test/soong_storage_probe.py \
                out/soong/.intermediates /tmp/rbe-test "${phase}-${tag}"
            ) >> /tmp/rbe-test/soong-storage-profile.log 2>&1 &
          }

          # Run in a separate low-priority process, guarded by flock.
          # The Ninja supervisor MUST NOT wait for a slow hashing pass.
          jar_probe_and_dedupe_async() {
            [ "$JAR_DEDUPE_MODE" != off ] || return 0
            [ -f /tmp/rbe-test/ci_jar_dedupe.py ] || return 0
            [ -d out/soong/.intermediates ] || return 0
            (
              exec 8>/tmp/rbe-test/jar-dedupe.lock
              flock -n 8 || exit 0
              # Use the 10s host-disk guard in the main monitor independently.
              # Keep I/O priority idle and CPU priority low for the 2-vCPU runner.
              ionice -c3 nice -n 15 timeout --signal=TERM --kill-after=5s 135s \
                python3 /tmp/rbe-test/ci_jar_dedupe.py \
                  --root out/soong/.intermediates \
                  --diagnostics /tmp/rbe-test \
                  --mode "$JAR_DEDUPE_MODE" \
                  --age-minutes "$JAR_DEDUPE_AGE_MINUTES" \
                  --hash-gib "$JAR_DEDUPE_HASH_GIB" \
                  --max-files "$JAR_DEDUPE_MAX_FILES" \
                  --min-host-gib "$JAR_DEDUPE_MIN_FREE_GIB" \
                || echo "JAR_DEDUPE_WORKER_NONZERO=$?"
            ) >> /tmp/rbe-test/jar-dedupe-worker.log 2>&1 &
          }

          # Shared supervisor for both 'nothing' and 'bacon'. It records an
          # explicit phase exit code and distinguishes disk/time stops from
          # compiler errors; an external SIGTERM is separately captured above.
          run_monitored_m() {
            local phase="$1" target="$2" log_file="$3" status_file="$4"
            local disk_trip="$5" time_trip="$6" memory_trip="${7:-}"
            local available now free_gib mem_kib seconds_left last_write idle_secs
            local line wait_rc warned=0 idle_warned=0 tick sample_counter=0
            local guard_consecutive=0
            rm -f "$status_file" "$disk_trip" "$time_trip"
            if [ -n "$memory_trip" ]; then rm -f -- "$memory_trip"; fi
            (
              # Avoid trap messages being written into Soong's stdout.
              trap - ERR TERM INT
              set +e
              set -o pipefail
              if [ "$phase" = build-graph ]; then
                export GOMAXPROCS="$SOONG_GRAPH_GOMAXPROCS"
                if [ "$SOONG_GRAPH_GC_TRACE" = 1 ]; then
                  # May reach bootstrap helpers, not the env -i primary builder.
                  # Primary builder has direct in-process GC configuration.
                  export GODEBUG="${GODEBUG:+${GODEBUG},}gctrace=1"
                fi
                echo "=== SOONG GRAPH GO RUNTIME: GOGC=$GOGC GOMAXPROCS=$GOMAXPROCS GOMEMLIMIT=${GOMEMLIMIT:-not-supported} GC_TRACE=$SOONG_GRAPH_GC_TRACE ==="
              else
                # Graph-specific profiling must not slow down full ROM compile.
                unset GOMAXPROCS GODEBUG || true
              fi
              m -j3 --skip-soong-tests "$target" 2>&1 | tee "$log_file"
              rc=${PIPESTATUS[0]}
              printf '%s\n' "$rc" > "$status_file"
              exit "$rc"
            ) &
            BUILD_PID=$!
            echo "=== $phase PID=$BUILD_PID; 10s DISK / RAM / TIME SUPERVISOR ==="
            while kill -0 "$BUILD_PID" 2>/dev/null; do
              available="$(disk_sample "$phase-sample")"
              now="$(date +%s)"
              free_gib=$((available / 1073741824))
              mem_kib="$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)"
              seconds_left=$((SOFT_DEADLINE_EPOCH - now))
              last_write="$(stat -c '%Y' "$log_file" 2>/dev/null || printf '%s\n' "$now")"
              idle_secs=$((now - last_write))
              if (( idle_secs < 0 )); then idle_secs=0; fi
              swap_free_kib="$(awk '/^SwapFree:/ {print $2}' /proc/meminfo)"
              line="$(date -u +'%Y-%m-%dT%H:%M:%SZ') phase=$phase pid=$BUILD_PID disk_safe_free=${free_gib}GiB mem_available=${mem_kib}KiB swap_free=${swap_free_kib}KiB log_idle=${idle_secs}s soft_deadline_remaining=${seconds_left}s"
              if (( BTRFS_ACTIVE == 1 )); then
                root_now="$(df -B1 --output=avail / | tail -n1 | tr -d ' ')"
                inner_now="$(df -B1 --output=avail "$PWD" | tail -n1 | tr -d ' ')"
                line="$line host_free_gib=$((root_now / 1073741824)) btrfs_free_gib=$((inner_now / 1073741824))"
              fi
              # Three consecutive low-resource samples, not a single dip.
              if [ "$phase" = build-graph ] && [ "$GRAPH_MEM_GUARD_ENABLED" = 1 ]; then
                if (( mem_kib <= GRAPH_MEM_GUARD_RAM_MIB * 1024 && \
                      swap_free_kib <= GRAPH_MEM_GUARD_SWAP_MIB * 1024 )); then
                  guard_consecutive=$((guard_consecutive + 1))
                else
                  guard_consecutive=0
                fi
                line="$line memory_guard_hits=${guard_consecutive}/${GRAPH_MEM_GUARD_SAMPLES}"
              fi
              echo "$line" | tee -a /tmp/rbe-test/resource-monitor.log
              sample_soong_memory "$phase"
              sample_soong_processes "$phase"
              if [ "$phase" = build-graph ]; then
                observe_primary_soong_environment
                if [ -s /tmp/rbe-test/soong-go-heap.tsv ] && (( sample_counter % 6 == 0 )); then
                  echo '=== ACTUAL PRIMARY SOONG GO HEAP (last sample, bytes) ==='
                  tail -n 1 /tmp/rbe-test/soong-go-heap.tsv || true
                fi
              fi
              # Live Actions log survives more cancellation scenarios than
              # artifact upload. No arguments/credentials are printed.
              if [ "$phase" = build-graph ]; then
                soong_rss=0; soong_vmswap=0
                while IFS= read -r spid; do
                  [ -r "/proc/$spid/status" ] || continue
                  sr="$(awk '/^VmRSS:/ {print $2}' "/proc/$spid/status" 2>/dev/null)"
                  ss="$(awk '/^VmSwap:/ {print $2}' "/proc/$spid/status" 2>/dev/null)"
                  soong_rss=$((soong_rss + ${sr:-0}))
                  soong_vmswap=$((soong_vmswap + ${ss:-0}))
                done < <(pgrep -x soong_build 2>/dev/null || true)
                zram_used_kib=0; zram_physical_kib=0
                if [ -s /tmp/rbe-test/zram-device.txt ]; then
                  zram_dev="$(cat /tmp/rbe-test/zram-device.txt)"
                  zram_node="${zram_dev##*/}"
                  if [ -r "/sys/block/$zram_node/mm_stat" ]; then
                    read -r z_orig z_compressed z_physical _ < "/sys/block/$zram_node/mm_stat" || true
                    zram_used_kib=$(( ${z_orig:-0} / 1024 ))
                    zram_physical_kib=$(( ${z_physical:-0} / 1024 ))
                  fi
                fi
                echo "SOONG_MEMORY rss_kib=$soong_rss vm_swap_kib=$soong_vmswap zram_logical_kib=$zram_used_kib zram_physical_kib=$zram_physical_kib cgroup_oom_kill=$(cgroup_event_value oom_kill)"
              fi
              # Capture the compiled binary's own Go version once it exists.
              # A runtime compiled with Go 1.18 cannot enforce GOMEMLIMIT.
              if [ "$phase" = build-graph ] && [ ! -s /tmp/rbe-test/soong-build-binary-go-version.txt ] \
                 && [ -x "$ANDROID_BUILD_TOP/out/host/linux-x86/bin/soong_build" ]; then
                if [ -x "$GO_BIN" ]; then
                  "$GO_BIN" version -m "$ANDROID_BUILD_TOP/out/host/linux-x86/bin/soong_build" \
                    > /tmp/rbe-test/soong-build-binary-go-version.txt 2>&1 || true
                fi
              fi
              # smaps_rollup can provoke I/O thrashing when swap is full;
              # capture deep reports every ~60s, while lightweight samples
              # remain every ~10s and the guard captures one final snapshot.
              if (( sample_counter % 6 == 0 )); then
                record_memory_pressure "$phase"
              fi
              sample_counter=$((sample_counter + 1))
              # Trim only inactive INFO rotations every ~60 seconds, never .rrpl.
              if (( sample_counter % RBE_LOG_SCAN_INTERVAL_SAMPLES == 0 )); then
                rbe_prune_closed_info || true
              fi
              # Separate size attributions at ~5-minute cadence, including Btrfs
              # physical allocation (stat blocks) and the real log target.
              if (( sample_counter % DISK_PROFILE_INTERVAL_SAMPLES == 0 )); then
                sample_build_disk_breakdown || true
              fi
              if [ "$phase" = full-rom-build ] \
                 && (( sample_counter % SOONG_PROFILE_INTERVAL_SAMPLES == 0 )); then
                profile_soong_intermediates "$phase" "$sample_counter" || true
              fi

              if [ "$phase" = build-graph ] && [ "$GRAPH_MEM_GUARD_ENABLED" = 1 ] \
                 && (( guard_consecutive >= GRAPH_MEM_GUARD_SAMPLES )); then
                {
                  echo "Soong memory safety stop: RAM available <= ${GRAPH_MEM_GUARD_RAM_MIB} MiB and swap free <= ${GRAPH_MEM_GUARD_SWAP_MIB} MiB"
                  echo "consecutive_samples=$guard_consecutive timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
                  echo "mem_available_kib=$mem_kib swap_free_kib=$swap_free_kib"
                  echo "cgroup_memory_current=$(cgroup_read memory.current)"
                  echo "cgroup_swap_current=$(cgroup_read memory.swap.current)"
                  echo "cgroup_oom_kill=$(cgroup_event_value oom_kill)"
                  echo '--- SOONG PID / CPU / RSS / VSZ ---'
                  tail -n 12 "$SOONG_PROCESS_TSV" || true
                } | tee "$memory_trip"
                extract_soong_gc_tail "$log_file"
                record_memory_pressure "graph-memory-guard-trip"
                echo "::error::Soong graph stopped proactively to preserve runner and diagnostics (exit 72)."
                stop_process_tree "$BUILD_PID"
                break
              fi
              if (( available < DISK_STOP_GIB * 1073741824 )); then
                echo "Disk safety stop in $phase: available below ${DISK_STOP_GIB} GiB" | tee "$disk_trip"
                echo "::error::Insufficient disk in $phase; terminating children."
                stop_process_tree "$BUILD_PID"
                break
              fi
              if (( now >= SOFT_DEADLINE_EPOCH )); then
                echo "Time safety stop in $phase: passed ${FULL_ROM_SOFT_DEADLINE_MINUTES}-minute whole-job deadline" | tee "$time_trip"
                echo "::error::Stopping $phase before GitHub job timeout to preserve diagnostics."
                stop_process_tree "$BUILD_PID"
                break
              fi
              if (( available < DISK_WARN_GIB * 1073741824 && warned == 0 )); then
                echo "::warning::Less than ${DISK_WARN_GIB} GiB available in $phase."
                warned=1
              fi
              # At most one bounded SHA-256 / duperemove pilot per interval.
              # No concurrent workers: flock protects the state and hash DB.
              # Only full ROM stage, never Soong graph or scanner smoke tests.
              if [ "$phase" = full-rom-build ] \
                 && (( sample_counter % JAR_DEDUPE_INTERVAL_SAMPLES == 0 )); then
                jar_probe_and_dedupe_async || true
              fi
              if (( idle_secs >= 900 && idle_warned == 0 )); then
                echo "::warning::$phase has produced no new log output for 15 minutes; inspect CPU/process state."
                ps -o pid,ppid,stat,etime,%cpu,%mem,args -p "$BUILD_PID" || true
                idle_warned=1
              fi
              for ((tick=0; tick<2; tick++)); do
                kill -0 "$BUILD_PID" 2>/dev/null || break
                sleep 5
              done
            done
            set +e
            wait "$BUILD_PID"
            wait_rc=$?
            set -e
            BUILD_PID=''
            MONITORED_RC="$wait_rc"
            if [ -s "$status_file" ]; then MONITORED_RC="$(cat "$status_file")"; fi
            if [ -s "$disk_trip" ]; then MONITORED_RC=70; fi
            if [ -s "$time_trip" ]; then MONITORED_RC=71; fi
            if [ -n "$memory_trip" ] && [ -s "$memory_trip" ]; then MONITORED_RC=72; fi
            disk_sample "post-$phase" >/dev/null
            sample_soong_memory "post-$phase exit=$MONITORED_RC"
            sample_soong_processes "post-$phase exit=$MONITORED_RC"
            if [ "$phase" = build-graph ]; then extract_soong_gc_tail "$log_file"; fi
            record_memory_pressure "post-$phase exit=$MONITORED_RC"
            echo "=== $phase EXIT: $MONITORED_RC ==="
          }

          enforce_initial_disk_guard pre-graph
          mark_stage build-graph
          # From here m-nothing.log and full-rom-build.log capture build output.
          # Do not mirror compiler output into configure-setup.log.
          exec 1>&3 2>&4
          exec 3>&- 4>&-
          : > /tmp/rbe-test/resource-monitor.log
          echo '=== GENERATE BUILD GRAPH (SKIP SOONG UNIT TESTS) ==='
          run_monitored_m build-graph nothing \
            /tmp/rbe-test/m-nothing.log \
            /tmp/rbe-test/graph-exit-code.txt \
            /tmp/rbe-test/graph-disk-stop-triggered.txt \
            /tmp/rbe-test/graph-time-stop-triggered.txt \
            /tmp/rbe-test/graph-memory-stop-triggered.txt
          if [ "$MONITORED_RC" -ne 0 ]; then
            echo '=== BUILD GRAPH LOG TAIL ==='
            tail -n 180 /tmp/rbe-test/m-nothing.log 2>/dev/null || true
            echo "::error::Soong build graph failed or was stopped (exit $MONITORED_RC)."
            exit "$MONITORED_RC"
          fi
          # Verify the instrumentation actually ran inside the primary graph.
          # A successful cached graph is valid too, but this fresh-run workflow
          # expects the telemetry marker unless Soong skipped regeneration.
          if [ -s /tmp/rbe-test/soong-go-heap.tsv ]; then
            echo '=== PRIMARY SOONG IN-PROCESS GC CONFIRMED ==='
            tail -n 3 /tmp/rbe-test/soong-go-heap.tsv || true
          else
            echo '::warning::No in-process Go heap sample recorded; inspect m-nothing.log and Soong regeneration.'
          fi
          # Soong's memory-heavy graph is complete. The prior run left only
          # ~19 MiB used inside the 8-GiB graph-only swap file, but did not
          # reclaim it because usage was nonzero. Evict tiny amounts safely.
          # Never swapoff large/populated swap or unlink an active swap file.
          mark_stage post-graph-swap-reclaim
          GRAPH_SWAP=/mnt/soong-swap-graph
          BASE_SWAP=/mnt/soong-swap-base
          RECLAIM_STATUS=/tmp/rbe-test/graph-swap-reclaim.txt
          MAX_RECLAIM_USED_BYTES=$((4 * 1024 * 1024 * 1024))
          MIN_RAM_MARGIN_BYTES=$((2 * 1024 * 1024 * 1024))
          free_disk_before="$(df -B1 --output=avail / | tail -n1 | tr -d ' ')"
          graph_swap_used='na'
          reclaim_reason='not-present'
          reclaim_result='retained'
          if [ -f "$GRAPH_SWAP" ]; then
            graph_swap_used="$(swapon --bytes --noheadings --show=NAME,USED \
              | awk -v path="$GRAPH_SWAP" '$1==path {print $2; found=1; exit} END {if (!found) print "na"}')"
            mem_available_bytes="$(awk '/^MemAvailable:/ {printf "%.0f", $2 * 1024}' /proc/meminfo)"
            echo "=== GRAPH SWAP RECLAIM PRECHECK: used=${graph_swap_used}B mem_available=${mem_available_bytes}B ==="
            swapon --show=NAME,TYPE,SIZE,USED,PRIO || true
            if [[ ! "$graph_swap_used" =~ ^[0-9]+$ ]]; then
              reclaim_reason='swap-not-active-or-usage-unknown'
            elif ! swapon --noheadings --show=NAME | grep -Fxq "$BASE_SWAP"; then
              reclaim_reason='baseline-swap-not-active'
            elif pgrep -x soong_build >/dev/null 2>&1; then
              reclaim_reason='soong-still-running'
            elif (( graph_swap_used > MAX_RECLAIM_USED_BYTES )); then
              reclaim_reason='more-than-256MiB-swapped'
            elif (( mem_available_bytes < graph_swap_used + MIN_RAM_MARGIN_BYTES )); then
              reclaim_reason='insufficient-RAM-margin'
            else
              # 90-second cap avoids unbounded stalls; swapoff remains best effort.
              # If interrupted or unsuccessful, the file is preserved.
              if sudo timeout --signal=TERM --kill-after=10s 90s swapoff "$GRAPH_SWAP"; then
                reclaim_rc=0
              else
                reclaim_rc=$?
              fi
              if (( reclaim_rc == 0 )) \
                 && ! swapon --noheadings --show=NAME | grep -Fxq "$GRAPH_SWAP"; then
                sudo rm -f -- "$GRAPH_SWAP"
                reclaim_result='reclaimed'
                reclaim_reason='swapoff-success'
                echo 'Graph-only swap deactivated and unlinked after safety checks.'
              else
                reclaim_reason="swapoff-failed-or-timeout-rc-${reclaim_rc}"
                echo "::warning::Swapoff did not safely complete (rc=$reclaim_rc); retained graph swap file."
              fi
            fi
          fi
          free_disk_after="$(df -B1 --output=avail / | tail -n1 | tr -d ' ')"
          freed_disk_bytes=$((free_disk_after - free_disk_before))
          {
            printf 'status=%s\nreason=%s\nused_bytes=%s\n' \
              "$reclaim_result" "$reclaim_reason" "$graph_swap_used"
            printf 'disk_free_before_bytes=%s\ndisk_free_after_bytes=%s\nreclaimed_disk_bytes=%s\n' \
              "$free_disk_before" "$free_disk_after" "$freed_disk_bytes"
          } | tee "$RECLAIM_STATUS"
          if [ "$reclaim_result" != reclaimed ]; then
            echo "::warning::Graph-only swap retained: $reclaim_reason. The 8-GiB file may constrain the ROM build."
          fi
          swapon --show=NAME,TYPE,SIZE,USED,PRIO || true
          df -h /home/runner/work/los
          mark_stage safe-git-objects-cleanup
          echo '=== LOCKED MANIFEST + CONTROLLED GIT STORAGE RECLAIM ==='
          LOCK=/tmp/rbe-test/source-manifest-locked.xml
          test -s "$LOCK"
          sha256sum -c /tmp/rbe-test/source-manifest-locked.sha256
          # Capture local CI-only changes not represented by pinned commit hashes.
          git -C build/soong diff -- cmd/soong_build/main.go             > /tmp/rbe-test/soong-gc-direct.patch || true
          git -C external/sonivox diff -- arm-wt-22k/lib_src/ARM_synth_constants_gnu.inc             > /tmp/rbe-test/sonivox-fix.patch || true
          git -C kernel/samsung/exynos9810 diff -- kernel/bpf/hashtab.c > /tmp/rbe-test/kernel-bpf-nullslists.patch || true
          # Preserve the exact repo implementation; do not replace it with an
          # empty or fabricated manifest. Only redirect the one manifest query
          # to the real locked snapshot after deleting Git object packs.
          if [ "${SAFE_GIT_OBJECT_TRIM}" = "1" ]; then
            REAL=.repo/repo/repo
            test -s "$REAL"
            if [ ! -e "${REAL}.before-ci-cleanup" ]; then
              cp -p "$REAL" "${REAL}.before-ci-cleanup"
            fi
            python3 - "$REAL" "$LOCK" <<'PYREPOBRIDGE'
          from pathlib import Path
          import sys
          exe=Path(sys.argv[1]); source=Path(sys.argv[2])
          original=exe.with_name(exe.name+'.before-ci-cleanup')
          assert original.is_file() and source.is_file()
          code="""#!/usr/bin/env python3
          import os, sys
          from pathlib import Path
          args=sys.argv[1:]
          # Return the ORIGINAL pinned manifest, never an empty placeholder.
          if args and args[0]=='manifest' and '-r' in args and all(
             a in ('manifest','-r','--revision-as-HEAD','-o','-') or a.endswith('.xml')
             for a in args):
              data=Path({source!r}).read_bytes()
              if '-o' in args:
                  idx=args.index('-o')
                  if idx+1 >= len(args): sys.exit('Missing -o file')
                  dst=args[idx+1]
                  if dst=='-': sys.stdout.buffer.write(data)
                  else: Path(dst).write_bytes(data)
              else: sys.stdout.buffer.write(data)
              sys.exit(0)
          os.execv(sys.executable,[sys.executable,{orig!r}]+args)
          """.format(source=str(source.resolve()),orig=str(original.resolve()))
          exe.write_text(code)
          exe.chmod(0o755)
          PYREPOBRIDGE
            # Verify the exact repo command previously failing in build-manifest.
            python3 "$REAL" manifest -r > /tmp/rbe-test/manifest-wrapper-probe.xml
            cmp -s "$LOCK" /tmp/rbe-test/manifest-wrapper-probe.xml
            echo 'Real locked manifest returned by repo manifest -r compatibility shim.'
            # Worktree remains unchanged; deleting the Git object stores can
            # disable regular Git commands for these projects. No sync follows.
            cat > /tmp/rbe-test/git-trim-targets.txt <<'EOFTRIMTARGETS'
          .repo/project-objects/platform/prebuilts/rust.git
          .repo/project-objects/platform/prebuilts/gradle-plugin.git
          .repo/project-objects/platform/prebuilts/sdk.git
          .repo/project-objects/LineageOS/android_cts.git
          .repo/project-objects/platform/external/deqp.git
          EOFTRIMTARGETS
            if [ "${SAFE_GIT_EXTENDED_TRIM:-0}" = 1 ]; then
              # These directories are Git object stores, not working-tree files.
              # Risk: later `git` commands for these projects will not function.
              cat >> /tmp/rbe-test/git-trim-targets.txt <<'EOFTRIMEXT'
          .repo/project-objects/platform/prebuilts/misc.git
          .repo/project-objects/platform/prebuilts/clang/host/linux-x86.git
          EOFTRIMEXT
            fi
            ROOT_BEFORE="$(df -B1 --output=avail / | tail -n1 | tr -d ' ')"
            IMAGE_BEFORE="$(stat -c '%b %B' "$BTRFS_BACKING" 2>/dev/null || echo '0 0')"
            printf 'target\tlogical_bytes_before\tstatus\n' > /tmp/rbe-test/git-cleanup-sizes.tsv
            while IFS= read -r candidate; do
              [ -n "$candidate" ] || continue
              # Exact allowlist. No dynamic paths and never delete .repo/repo.
              case "$candidate" in
                .repo/project-objects/platform/prebuilts/abi-dumps|.repo/project-objects/platform/prebuilts/rust.git|.repo/project-objects/platform/prebuilts/gradle-plugin.git|.repo/project-objects/platform/prebuilts/sdk.git|.repo/project-objects/LineageOS/android_cts.git|.repo/project-objects/platform/external/deqp.git|.repo/project-objects/platform/prebuilts/misc.git|.repo/project-objects/platform/prebuilts/clang/host/linux-x86.git) ;;
                *) echo "::error::Refusing unexpected Git trim path: $candidate"; exit 1 ;;
              esac
              if [ -L "$candidate" ]; then
                echo "Skip symlink: $candidate"
                continue
              fi
              if [ -d "$candidate" ]; then
                kib="$(du -sk "$candidate" | awk '{print $1}')"
                printf '%s\t%s\tremoved\n' "$candidate" "$((kib*1024))" >> /tmp/rbe-test/git-cleanup-sizes.tsv
                echo "Removing Git object-only directory: $candidate ($(($kib/1024)) MiB logical)"
                rm -rf -- "$candidate"
              else
                printf '%s\t0\tabsent\n' "$candidate" >> /tmp/rbe-test/git-cleanup-sizes.tsv
              fi
            done < /tmp/rbe-test/git-trim-targets.txt
            # abi-dumps has subprojects; remove only its direct *.git dirs.
            find .repo/project-objects/platform/prebuilts/abi-dumps -mindepth 1               -maxdepth 1 -type d -name '*.git' -print0 2>/dev/null               | while IFS= read -r -d '' d; do
                  du -sk "$d" || true
                  rm -rf -- "$d"
                done || true
            ROOT_AFTER="$(df -B1 --output=avail / | tail -n1 | tr -d ' ')"
            echo "host_free_delta_after_git_delete_bytes=$((ROOT_AFTER-ROOT_BEFORE))"               | tee /tmp/rbe-test/git-storage-delta.txt
            echo "btrfs_image_allocated_before_blocks_and_blocksize=$IMAGE_BEFORE"               >> /tmp/rbe-test/git-storage-delta.txt
            stat -c 'btrfs_image_after_blocks=%b blocksize=%B' "$BTRFS_BACKING"               >> /tmp/rbe-test/git-storage-delta.txt 2>/dev/null || true
            sha256sum -c /tmp/rbe-test/source-manifest-locked.sha256
          else
            echo 'SAFE_GIT_OBJECT_TRIM=0: preserving Git metadata.'
          fi
          # fstrim works only if discard passes through the mounted loop and
          # backing filesystem. A no-op/failure must never fail the ROM build.
          if (( BTRFS_ACTIVE == 1 )); then
            echo '=== OPTIONAL POST-CLEANUP BTRFS DISCARD ==='
            du -h "$BTRFS_BACKING" || true
            lsblk -D | head -n 20 || true
            sudo timeout 90s fstrim -v "$ANDROID_BUILD_TOP"               > /tmp/rbe-test/btrfs-fstrim.log 2>&1 || true
            du -h "$BTRFS_BACKING" || true
          fi
          echo '=== STORAGE AFTER GIT OBJECTS CLEANUP ==='
          df -h / /home/runner/work/los
          enforce_initial_disk_guard post-graph

          BUILD_NINJA="$ANDROID_BUILD_TOP/out/combined-${TARGET_PRODUCT}.ninja"

          if [ ! -s "$BUILD_NINJA" ]; then
            echo "::warning::Expected combined ninja was not found at: $BUILD_NINJA"
            BUILD_NINJA="$(
              find "$ANDROID_BUILD_TOP/out" \
                -maxdepth 1 \
                -type f \
                -name 'combined*.ninja' \
                -print | head -1
            )"
          fi

          if [ -z "${BUILD_NINJA:-}" ] || [ ! -s "$BUILD_NINJA" ]; then
            echo "::error::Could not locate the generated combined Ninja graph."
            find "$ANDROID_BUILD_TOP/out" -maxdepth 2 -type f -name '*.ninja' -print | head -100 || true
            exit 1
          fi

          echo "BUILD_NINJA=$BUILD_NINJA" | tee /tmp/rbe-test/build-ninja.txt

          mark_stage verify-rbe-graph
          SOONG_NINJA="$ANDROID_BUILD_TOP/out/soong/build.${TARGET_PRODUCT}.ninja"
          RBE_GRAPH_MATCHES=/tmp/rbe-test/rewrapper-ninja-matches.txt
          RBE_PROBE_LOG=/tmp/rbe-test/rbe-compile-command.txt
          RBE_SAMPLE_TARGET_FILE=/tmp/rbe-test/rbe-sample-target.txt
          echo '=== VERIFY ACTUAL SOONG AND COMBINED NINJA FILES ==='
          if [ ! -s "$SOONG_NINJA" ]; then
            echo "::error::Primary Soong Ninja graph missing: $SOONG_NINJA"
            find out/soong -maxdepth 1 -name '*ninja' -print || true
            exit 73
          fi
          test -s "$BUILD_NINJA"
          stat -c '%n bytes=%s' "$SOONG_NINJA" "$BUILD_NINJA"
          {
            printf 'primary_soong_ninja=%s\ncombined_ninja=%s\n' "$SOONG_NINJA" "$BUILD_NINJA"
            echo '=== References in actual primary Soong graph (diagnostic only) ==='
            grep -n -m 30 -E 'rewrapper|remoteexecution-client|RBE_' "$SOONG_NINJA" || true
          } > "$RBE_GRAPH_MATCHES"
          sed -n '1,35p' "$RBE_GRAPH_MATCHES"

          # ninja -t commands expands variables and includes subninja references.
          # Only a C/C++ *compile command* using rewrapper is a valid pass.
          # Stream target inventory: never load the huge graph/target list in RAM.
          echo '=== VERIFY EXPANDED LIBBASE C/C++ COMMAND ==='
          cat > /tmp/rbe-test/rbe_graph_probe.py <<'PYRBEGRAPH'
          #!/usr/bin/env python3
          """Lightweight Ninja graph probe for Android libbase remote C/C++ compilation.
          
          Runs ninja query tools only: never compiles anything.
          """
          import pathlib
          import re
          import subprocess
          import sys
          
          
          def is_wrapped_command(command):
              return bool(
                  re.search(r"(?:^|[\s;/])(?:[^\s;]*/)?rewrapper(?=[\s;]|$)", command)
                  and re.search(r"(?:clang\+\+|\bclang\b|\bg\+\+\b|\bgcc\b)", command)
                  and re.search(r"--exec_strategy=(?:\"?remote\"?)(?=[\s;]|$)", command)
              )
          
          
          def post_build(graph, report, target_file):
              folder = pathlib.Path("out/soong/.intermediates/system/libbase/libbase")
              chosen = target_file.read_text().strip() if target_file.exists() else ""
              built = []
              if chosen and pathlib.Path(chosen).is_file() and pathlib.Path(chosen).stat().st_size:
                  built.append(pathlib.Path(chosen))
              if folder.is_dir():
                  for target in folder.rglob("*.o"):
                      if target.is_file() and target.stat().st_size and target not in built:
                          built.append(target)
                          if len(built) >= 20:
                              break
              for file in built:
                  command = subprocess.run(
                      ["ninja", "-f", str(graph), "-t", "commands", "-s", str(file)],
                      capture_output=True, text=True, errors="replace", timeout=120,
                  )
                  if command.returncode == 0 and is_wrapped_command(command.stdout.strip()):
                      with report.open("a") as f:
                          f.write("\npost_build_verdict=PASS_WRAPPED_OBJECT_BUILT\n")
                          f.write("post_build_proof_object=" + str(file) + "\n")
                          f.write("post_build_proof_bytes=" + str(file.stat().st_size) + "\n")
                      target_file.write_text(str(file) + "\n")
                      print("Confirmed actual compiled object with rewrapper command: " + str(file))
                      return 0
              with report.open("a") as f:
                  f.write("\nERROR=no compiled libbase C/C++ object with expanded rewrapper command\n")
              return 73
          
          
          def main():
              graph = pathlib.Path(sys.argv[1])
              report = pathlib.Path(sys.argv[2])
              target_file = pathlib.Path(sys.argv[3])
              if len(sys.argv) > 4 and sys.argv[4] == "post-build":
                  return post_build(graph, report, target_file)
              out = []
              preferred_targets = []
              other_android_targets = []
              fallback_targets = []
              proc = subprocess.Popen(
                  ["ninja", "-f", str(graph), "-t", "targets", "all"],
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,
                  errors="replace", bufsize=1,
              )
              for line in proc.stdout:
                  if not line.startswith("out/soong/.intermediates/system/libbase/libbase/"):
                      continue
                  target = line.partition(": ")[0]
                  if target.endswith(".o"):
                      if "android_arm64" in target:
                          if len(preferred_targets) < 32:
                              preferred_targets.append(target)
                      elif "/android_" in target:
                          if len(other_android_targets) < 16:
                              other_android_targets.append(target)
                      elif len(fallback_targets) < 16:
                          fallback_targets.append(target)
                      if len(preferred_targets) >= 32:
                          break
              if len(preferred_targets) >= 32:
                  proc.terminate()
                  try:
                      proc.communicate(timeout=10)
                  except subprocess.TimeoutExpired:
                      proc.kill()
                      proc.communicate()
              else:
                  _, err = proc.communicate()
                  if proc.returncode:
                      report.write_text("ninja -t targets all failed: " + err[-2000:] + "\n")
                      return 73
          
              candidate_targets = preferred_targets + other_android_targets + fallback_targets
              out.append("candidates_collected=" + str(len(candidate_targets)))
              matched = None
              for target in candidate_targets[:20]:
                  result = subprocess.run(
                      ["ninja", "-f", str(graph), "-t", "commands", "-s", target],
                      capture_output=True, text=True, errors="replace", timeout=120,
                  )
                  if result.returncode:
                      out.append("query_error=" + target + " rc=" + str(result.returncode)
                                 + " stderr=" + result.stderr[-500:].replace("\n", " "))
                      continue
                  # Ninja expands variables; a literal mention of a rewrapper *path*
                  # in a file is not evidence that a compiler action runs through it.
                  cmd = result.stdout.strip()
                  if is_wrapped_command(cmd):
                      matched = (target, cmd)
                      break
                  out.append("not_remote=" + target + " snippet=" + cmd[:200].replace("\n", " "))
              if not matched:
                  out.append("ERROR: no libbase C/C++ compile command actually uses rewrapper")
                  out.append("Inspected an expanded Ninja command, not just text matches.")
                  report.write_text("\n".join(out) + "\n")
                  return 73
          
              target, command = matched
              target_file.write_text(target + "\n")
              out.extend([
                  "selected_target=" + target,
                  "remote_strategy_expected=remote",
                  "ninja_expanded_command=" + command[:20000],
                  "verdict=PASS_EXPANDED_LIBBASE_CXX_COMMAND_USES_REWRAPPER",
              ])
              report.write_text("\n".join(out) + "\n")
              print("Verified rewrapper in expanded C/C++ build command: " + target)
              return 0
          
          
          if __name__ == "__main__":
              try:
                  sys.exit(main())
              except (OSError, subprocess.SubprocessError, ValueError) as exc:
                  pathlib.Path(sys.argv[2]).write_text("probe_exception=" + str(exc) + "\n")
                  print("RBE command probe failed: " + str(exc), file=sys.stderr)
                  sys.exit(73)
          PYRBEGRAPH
          if ! python3 /tmp/rbe-test/rbe_graph_probe.py \
            "$BUILD_NINJA" "$RBE_PROBE_LOG" "$RBE_SAMPLE_TARGET_FILE"; then
            cat "$RBE_PROBE_LOG" || true
            echo '::error::No executable libbase C/C++ command routed through rewrapper.'
            exit 73
          fi
          sed -n '1,8p' "$RBE_PROBE_LOG"
          echo '=== VERIFY CLANG DWARF LEVEL IN REAL RBE COMPILE COMMAND ==='
          python3 - "$RBE_PROBE_LOG" "$CLANG_DEFAULT_DEBUG_LEVEL" <<'PYDWARF'
          import pathlib,re,sys
          content=pathlib.Path(sys.argv[1]).read_text(errors='replace')
          mode=sys.argv[2]
          wanted={'debug_level_0':'-g0','debug_level_1':'-g1','debug_level_g':'-g'}[mode]
          observed=re.findall(r'(?<!\S)-g(?:[0123])?(?!\S)',content)
          with pathlib.Path('/tmp/rbe-test/dwarf-ninja-verification.txt').open('w') as out:
              out.write(f'mode={mode} wanted={wanted} observed={observed[:30]}\n')
          # A compile may use a later module-specific -g override; do not claim
          # this one representative libbase command proves all modules are optimized.
          if wanted not in observed:
              raise SystemExit(f'DWARF setting {wanted} is missing in libbase Ninja compile sample; check Soong propagation')
          print(f'DWARF_NINJA_PROBE_PASSED mode={mode} flags={observed[:10]}')
          PYDWARF
          echo '=== PINNED RECLIENT OUTPUT PATH CHECK ==='
          cat /tmp/rbe-test/reclient-version.txt
          test -x "$RBE_DIR/rewrapper"
          test -x "$RBE_DIR/reproxy"
          test -x "$RBE_DIR/scandeps_server"
          # Explicitly refuse local fallback for the proof run.
          if [ "${RBE_CXX_EXEC_STRATEGY:-}" != remote ]; then
            echo '::error::Remote-only C/C++ strategy is required for this trial.'
            exit 73
          fi

          # Compile libbase through the normal Soong/m entry point so that
          # Soong manages the reproxy socket lifecycle correctly. Do NOT call
          # Ninja standalone after m nothing: its previous reproxy has stopped.
          mark_stage rbe-libbase-smoke
          enforce_initial_disk_guard pre-rbe-libbase-smoke
          echo '=== LIBBASE REAL REMOTE COMPILE SMOKE ==='
          run_monitored_m rbe-libbase-smoke libbase \
            /tmp/rbe-test/rbe-libbase-smoke.log \
            /tmp/rbe-test/rbe-libbase-exit-code.txt \
            /tmp/rbe-test/rbe-libbase-disk-stop-triggered.txt \
            /tmp/rbe-test/rbe-libbase-time-stop-triggered.txt
          if [ "$MONITORED_RC" -ne 0 ]; then
            echo '=== STANDALONE CLANG SCANNER / RBE FAILURE SIGNATURES ==='
            {
              echo "reclient_version=$(tr -d '\r\n' < "$RBE_DIR/version.txt")"
              echo "depsscanner_address=${RBE_depsscanner_address}"
              grep -anE -m 80 \
                'ClangScanDeps|scandeps_server|processing inputs failed|failed to get dependencies|unsupported argument|ftrivial-auto-var-init|LOCAL_ERROR|UNAUTHENTICATED|PERMISSION_DENIED|UNAVAILABLE|DeadlineExceeded' \
                /tmp/rbe-test/rbe-libbase-smoke.log \
                /tmp/rbe-test/reproxy.INFO /tmp/rbe-test/reproxy.ERROR 2>/dev/null \
                | cut -c 1-400 || true
            } > /tmp/rbe-test/rbe-scanner-smoke-diagnostics.txt
            tail -n 100 /tmp/rbe-test/rbe-scanner-smoke-diagnostics.txt || true
            tail -n 180 /tmp/rbe-test/rbe-libbase-smoke.log || true
            echo "::error::libbase remote compilation failed (exit $MONITORED_RC); see scanner diagnostics."
            exit "$MONITORED_RC"
          fi
          # Confirm one .o actually produced by this libbase smoke is also a
          # Ninja-expanded rewrapper/clang command (not merely a graph string).
          if ! python3 /tmp/rbe-test/rbe_graph_probe.py             "$BUILD_NINJA" "$RBE_PROBE_LOG" "$RBE_SAMPLE_TARGET_FILE" post-build; then
            tail -n 50 "$RBE_PROBE_LOG" || true
            echo '::error::libbase built, but no produced C/C++ object proved remote rewrapper execution.'
            exit 73
          fi
          RBE_SAMPLE_TARGET="$(cat "$RBE_SAMPLE_TARGET_FILE")"
          {
            echo 'status=PASS'
            echo 'target_module=libbase'
            echo "compiled_object=$RBE_SAMPLE_TARGET"
            echo "compiled_object_bytes=$(stat -c %s "$RBE_SAMPLE_TARGET")"
            echo 'cxx_execution_strategy=remote'
            echo "reclient_version=$(tr -d '\r\n' < "$RBE_DIR/version.txt")"
            echo "depsscanner_address=${RBE_depsscanner_address}"
            echo 'expanded_cxx_command_uses_rewrapper=true'
            echo 'libbase_build_exit_code=0'
            echo 'note=Successful remote-only libbase smoke and on-disk C++ object with matching expanded rewrapper command. Server-side BuildBuddy metrics not independently queried.'
          } | tee /tmp/rbe-test/rbe-libbase-verification.txt
          echo '=== RBE SMOKE LOG STATS ==='
          grep -aE 'RBE Stats:|Downloaded:|Uploaded:' \
            /tmp/rbe-test/rbe-libbase-smoke.log | tail -n 25 || true
          echo '=== RBE METRICS DIAGNOSTIC ==='
          grep -aE 'action_counts|num_remote|remote_ex|num_records' \
            /tmp/rbe-test/rbe_metrics.txt | tail -n 30 || true

          # Run Sonivox through actual Soong/RBE early, not 74 minutes into
          # the ROM build. This checks the assembler path, not just Clang -E.
          mark_stage rbe-sonivox-smoke
          echo '=== SONIVOX ARM/RBE COMPILE SMOKE ==='
          run_monitored_m rbe-sonivox-smoke libsonivox \
            /tmp/rbe-test/rbe-sonivox-smoke.log \
            /tmp/rbe-test/rbe-sonivox-exit-code.txt \
            /tmp/rbe-test/rbe-sonivox-disk-stop-triggered.txt \
            /tmp/rbe-test/rbe-sonivox-time-stop-triggered.txt
          if [ "$MONITORED_RC" -ne 0 ]; then
            echo '=== SONIVOX SCANNER / ASSEMBLER ERRORS ==='
            grep -anE -m 80 'ARM_synth_constants_gnu|#endif without #if|ARM-E_filter_gnu|ARM-E_mastergain_gnu|processing inputs failed|error:' \
              /tmp/rbe-test/rbe-sonivox-smoke.log | cut -c 1-450 \
              > /tmp/rbe-test/sonivox-smoke-errors.txt || true
            tail -n 100 /tmp/rbe-test/sonivox-smoke-errors.txt || true
            echo "::error::Sonivox did not compile (exit $MONITORED_RC); build ROM not started."
            exit "$MONITORED_RC"
          fi
          echo 'SONIVOX_RBE_SMOKE_PASSED' | tee /tmp/rbe-test/sonivox-smoke-result.txt

          # Build the *exact Ninja kernel Image target* that failed around
          # 92% of the prior full ROM build. This uses the standard m/Soong
          # path and writes the SAME Image file, so bacon can reuse it.
          # Unlike a compiler-only toy test, this covers real Kbuild/config.
          mark_stage kernel-image-smoke
          KERNEL_IMAGE_TARGET=out/target/product/star2lte/obj/KERNEL_OBJ/arch/arm64/boot/Image
          echo "=== KERNEL IMAGE EARLY SMOKE: $KERNEL_IMAGE_TARGET ==="
          echo 'Checking exact target in generated combined Ninja graph.'
          if ! ninja -f "$BUILD_NINJA" -t query "$KERNEL_IMAGE_TARGET" \
               > /tmp/rbe-test/kernel-target-query.txt 2>&1; then
            cat /tmp/rbe-test/kernel-target-query.txt || true
            echo '::error::Kernel Image target missing in Ninja graph; cannot claim a valid smoke test.'
            exit 74
          fi
          echo '=== BUILD REAL KERNEL IMAGE BEFORE FULL ROM ==='
          enforce_initial_disk_guard pre-kernel-image-smoke
          run_monitored_m kernel-image-smoke "$KERNEL_IMAGE_TARGET" \
            /tmp/rbe-test/kernel-image-smoke.log \
            /tmp/rbe-test/kernel-image-exit-code.txt \
            /tmp/rbe-test/kernel-image-disk-stop-triggered.txt \
            /tmp/rbe-test/kernel-image-time-stop-triggered.txt
          if [ "$MONITORED_RC" -ne 0 ]; then
            grep -anE -m 100 '(^FAILED:|error:|hashtab.c:|incompatible pointer|ninja failed)' \
              /tmp/rbe-test/kernel-image-smoke.log | tail -n 100 | cut -c 1-450 \
              > /tmp/rbe-test/kernel-image-errors.txt || true
            tail -n 100 /tmp/rbe-test/kernel-image-errors.txt || true
            echo "::error::Kernel Image smoke failed (exit $MONITORED_RC); ROM build not started."
            exit "$MONITORED_RC"
          fi
          if [ ! -s "$KERNEL_IMAGE_TARGET" ]; then
            echo '::error::Kernel Image smoke command succeeded but Image is missing or empty.'
            exit 74
          fi
          {
            echo 'status=PASS'
            echo "target=$KERNEL_IMAGE_TARGET"
            echo "image_bytes=$(stat -c %s "$KERNEL_IMAGE_TARGET")"
            echo 'source_fix=kernel-bpf-nullslists.patch'
          } | tee /tmp/rbe-test/kernel-image-verification.txt
          echo 'KERNEL_IMAGE_SMOKE_PASSED'

          mark_stage pre-build
          echo "=== FULL ROM BUILD: star2lte / bacon ==="
          echo "RBE remote-only enabled; jobs=2, highmem=1, no local ccache."
          echo "libbase, Sonivox and the real kernel Image smoke passed; bacon reuses these outputs."
          enforce_initial_disk_guard pre-build

          if (( $(date +%s) >= SOFT_DEADLINE_EPOCH )); then
            echo '::error::Not enough whole-job time remains to begin full ROM build.'
            exit 71
          fi
          BUILD_LOG=/tmp/rbe-test/full-rom-build.log
          mark_stage full-rom-build
          run_monitored_m full-rom-build bacon "$BUILD_LOG" \
            /tmp/rbe-test/build-exit-code.txt \
            /tmp/rbe-test/disk-stop-triggered.txt \
            /tmp/rbe-test/time-stop-triggered.txt
          BUILD_RC="$MONITORED_RC"

          if [ "$BUILD_RC" -ne 0 ]; then
            echo '=== BUILD ERROR LINES (LAST 120 MATCHES) ==='
            grep -anE '(^FAILED:|(^|[[:space:]])error:|No space left on device|Killed|ninja failed|out of memory|missing depfile)' "$BUILD_LOG" 2>/dev/null | tail -n 120 || true
            echo '=== FULL ROM BUILD LOG TAIL ==='
            tail -n 200 "$BUILD_LOG" 2>/dev/null || true
            echo '=== REPROXY STDERR TAIL ==='
            tail -n 100 /tmp/rbe-test/reproxy_outerr.log 2>/dev/null || true
            echo "::error::Full ROM build did not complete (exit $BUILD_RC). See attached diagnostics."
            exit "$BUILD_RC"
          fi

          mark_stage verify-rom-zip
          # A successful Ninja exit alone is not enough: verify flashable ZIP.
          ROM_DIR="$ANDROID_BUILD_TOP/out/target/product/star2lte"
          echo "=== ROM OUTPUT DIRECTORY ==="
          ls -lah "$ROM_DIR" | tail -n 45
          mapfile -d '' -t ROM_ZIPS < <(find "$ROM_DIR" -maxdepth 1 -type f -name 'lineage-*.zip' -print0)
          if (( ${#ROM_ZIPS[@]} == 0 )); then
            echo "::error::bacon succeeded but no lineage-*.zip found in $ROM_DIR"
            exit 1
          fi
          ROM_ZIP="${ROM_ZIPS[0]}"
          if (( ${#ROM_ZIPS[@]} > 1 )); then
            ROM_ZIP="$(find "$ROM_DIR" -maxdepth 1 -type f -name 'lineage-*.zip' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          fi
          test -s "$ROM_ZIP"
          echo "ROM_ZIP=$ROM_ZIP"
          ls -lh "$ROM_ZIP"
          echo "=== CHECK ROM ZIP INTEGRITY ==="
          unzip -tq "$ROM_ZIP" | tail -n 8
          sha256sum "$ROM_ZIP" | tee /tmp/rbe-test/rom-sha256.txt
          basename "$ROM_ZIP" > /tmp/rbe-test/rom-filename.txt
          echo "=== FULL ROM BUILD PASSED ==="
          echo "Lineage product: ${TARGET_PRODUCT}-${TARGET_RELEASE}-${TARGET_BUILD_VARIANT}"
          echo 'Full bacon target completed with remote C++ compilation enabled.'
          mark_stage complete

      - name: Upload completed LineageOS ROM
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lineage-21.0-star2lte-${{ github.run_id }}
          path: /home/runner/work/los/out/target/product/star2lte/lineage-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Summarize storage measurements
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/rbe-test
          FILE=/tmp/rbe-test/resource-samples.tsv
          {
            echo '## LineageOS 21.0 full ROM trial — disk and RAM'
            echo ''
            echo '| Stage (UTC) | Free GiB | Used GiB | RAM available GiB |'
            echo '|---|---:|---:|---:|'
            if [ -s "$FILE" ]; then
              # Show first/last rows and build low-watermark; no expensive du.
              awk -F '\t' 'NR>1 && NF>=5 {
                free=$3/1073741824; used=$4/1073741824; ram=$5/1048576;
                if (!seen || free<min) {min=free; low=$2 " " $1};
                if ($2!="build-sample" && $2!="full-rom-sample") printf "| %s: %s | %.1f | %.1f | %.1f |\n",$2,$1,free,used,ram;
                seen=1
              } END {
                if(seen) printf "\nLowest observed free disk: **%.1f GiB** at %s.\n",min,low;
                else print "No storage samples recorded."
              }' "$FILE"
            else
              echo '| No measurements | — | — | — |'
            fi
            echo ''
            echo "Disk guard: warning under ${DISK_WARN_GIB} GiB; safe stop under ${DISK_STOP_GIB} GiB."
            echo "Workspace: **${WORKSPACE_STORAGE}**; Ninja remote=${NINJA_REMOTE_NUM_JOBS}, local=2, highmem=${NINJA_HIGHMEM_NUM_JOBS}."
            if [ -s /tmp/rbe-test/btrfs-storage-samples.tsv ]; then
              echo '### Btrfs ZSTD host/root accounting'
              echo '```text'
              tail -n 8 /tmp/rbe-test/btrfs-storage-samples.tsv
              echo '```'
            fi
            if [ -s /tmp/rbe-test/webview-lfs-check.log ]; then
              echo '### WebView LFS validation'
              echo '```text'
              tail -n 15 /tmp/rbe-test/webview-lfs-check.log
              echo '```'
            fi
            echo "Soong: GOGC=${SOONG_GOGC}; GOMEMLIMIT=${SOONG_GOMEMLIMIT} (Go >=1.19 only); graph GOMAXPROCS=${SOONG_GRAPH_GOMAXPROCS}; gctrace=${SOONG_GRAPH_GC_TRACE}."
            echo "Graph memory guard: enabled=${GRAPH_MEM_GUARD_ENABLED}, RAM<=${GRAPH_MEM_GUARD_RAM_MIB} MiB AND swap<=${GRAPH_MEM_GUARD_SWAP_MIB} MiB for ${GRAPH_MEM_GUARD_SAMPLES} consecutive samples."
            echo "Hybrid swap requested: ZRAM=${SOONG_ZRAM_GIB}GiB logical; disk=${SOONG_DISK_SWAP_GIB}GiB (post-graph base ${POST_GRAPH_DISK_SWAP_GIB}GiB)."
            echo '### Soong Go/runtime verification'
            if [ -s /tmp/rbe-test/soong-go-runtime.txt ]; then
              echo '```text'
              cat /tmp/rbe-test/soong-go-runtime.txt
              echo '```'
            fi
            if [ -s /tmp/rbe-test/soong-build-binary-go-version.txt ]; then
              echo '```text'
              cat /tmp/rbe-test/soong-build-binary-go-version.txt
              echo '```'
            fi
            if [ -s /tmp/rbe-test/soong-memory-samples.tsv ]; then
              awk -F '\t' 'NR > 1 && NF >= 14 {
                if($5 > maxrss) maxrss=$5;
                if($7 > maxswap) maxswap=$7;
                if($3 > 0 && (minram == 0 || $3 < minram)) minram=$3;
                if($14 != "na" && $14 != "" && $14+0 > maxkill) maxkill=$14+0
              } END {
                printf "Peak sampled soong_build RSS: **%.2f GiB**; VmSwap: **%.2f GiB**; lowest available RAM: **%.2f GiB**.\n", maxrss/1048576, maxswap/1048576, minram/1048576;
                printf "Maximum sampled cgroup oom_kill counter: **%d** (check baseline for changes).\n", maxkill
              }' /tmp/rbe-test/soong-memory-samples.tsv
            fi
            if [ -s /tmp/rbe-test/graph-memory-stop-triggered.txt ]; then
              echo '**Soong graph proactively stopped due to sustained low RAM AND low swap.**'
              echo '```text'
              cat /tmp/rbe-test/graph-memory-stop-triggered.txt
              echo '```'
            fi
            if [ -s /tmp/rbe-test/soong-gc-trace-tail.log ]; then
              echo '### Last Go GC traces from graph (may include multiple Go processes)'
              echo '```text'
              tail -n 12 /tmp/rbe-test/soong-gc-trace-tail.log
              echo '```'
            fi
            if [ -s /tmp/rbe-test/soong-process-samples.tsv ]; then
              echo '### Recent Soong PID / CPU / RSS samples'
              echo '```text'
              tail -n 8 /tmp/rbe-test/soong-process-samples.tsv
              echo '```'
            fi
            for status in /tmp/rbe-test/zram-status.txt /tmp/rbe-test/swap-status.txt /tmp/rbe-test/graph-swap-reclaim.txt; do
              if [ -s "$status" ]; then
                echo '```text'
                echo "$(basename "$status")"
                cat "$status"
                echo '```'
              fi
            done
            if [ -s /tmp/rbe-test/disk-stop-triggered.txt ]; then
              echo '**Guard triggered: build terminated due to low disk.**'
            fi
            echo ''
            echo '### Prebuilts: largest directories (post-sync)'
            if [ -s /tmp/rbe-test/prebuilts-size.log ]; then
              echo '```text'
              tail -n 16 /tmp/rbe-test/prebuilts-size.log
              echo '```'
            else
              echo 'No prebuilts breakdown was captured.'
            fi
            echo ''
            echo '### Git repo metadata: largest directories (post-sync)'
            if [ -s /tmp/rbe-test/repo-size.log ]; then
              echo '```text'
              tail -n 12 /tmp/rbe-test/repo-size.log
              echo '```'
            else
              echo 'No .repo breakdown was captured.'
            fi
            echo ''
            echo '### Clang toolchains: largest paths'
            if [ -s /tmp/rbe-test/clang-detail.log ]; then
              echo '```text'
              tail -n 18 /tmp/rbe-test/clang-detail.log
              echo '```'
            else
              echo 'No Clang deep profile was captured.'
            fi
            echo ''
            echo '### Gradle plugin: largest paths'
            if [ -s /tmp/rbe-test/gradle-detail.log ]; then
              echo '```text'
              tail -n 10 /tmp/rbe-test/gradle-detail.log
              echo '```'
            else
              echo 'No Gradle deep profile was captured.'
            fi
            echo ''
            echo '### Platform Git objects: largest paths'
            if [ -s /tmp/rbe-test/platform-objects-detail.log ]; then
              echo '```text'
              tail -n 16 /tmp/rbe-test/platform-objects-detail.log
              echo '```'
            else
              echo 'No platform Git-object deep profile was captured.'
            fi
            echo ''
            if [ -s /tmp/rbe-test/prebuilts-projects.log ]; then
              echo "Prebuilts projects listed in manifest: **$(wc -l < /tmp/rbe-test/prebuilts-projects.log)**."
            else
              echo 'No prebuilts manifest project list was captured.'
            fi
            echo 'Storage profiling did not modify source or Git objects.'
            echo ''
            echo '### P1 host-binary / historical ABI worktree trim'
            if [ -s /tmp/rbe-test/storage-trim-p1.log ]; then
              echo '```text'
              grep -E '^(TRIM |SKIP |disk_available_(before|after|delta)_bytes=|P1 trim changes)' \
                /tmp/rbe-test/storage-trim-p1.log | tail -n 30 || true
              echo '```'
            else
              echo 'P1 trim did not execute.'
            fi
            echo ''
            echo '### P0 reclient trim'
            if [ -s /tmp/rbe-test/p0-storage-trim-status.txt ]; then
              cat /tmp/rbe-test/p0-storage-trim-status.txt
            else
              echo 'P0 trim did not finish; see diagnostic artifact.'
            fi
            if [ -s /tmp/rbe-test/p0-reclient-size.txt ]; then
              echo '```text'
              cat /tmp/rbe-test/p0-reclient-size.txt
              echo '```'
            fi
            echo ''
            echo '### Configure stage (P0.1 diagnostics)'
            if [ -s /tmp/rbe-test/configure-failure.txt ]; then
              echo '**The configure/build step exited with an error:**'
              echo '```text'
              cat /tmp/rbe-test/configure-failure.txt
              echo '```'
            elif [ -s /tmp/rbe-test/configure-success.txt ]; then
              echo 'Configure/build step completed successfully.'
            else
              echo 'Configure/build step did not record a final exit status.'
            fi
            if [ -s /tmp/rbe-test/configure-stages.log ]; then
              echo '```text'
              tail -n 20 /tmp/rbe-test/configure-stages.log
              echo '```'
            fi
            echo ''
            echo '### ROM output'
            if [ -s /tmp/rbe-test/rom-filename.txt ]; then
              echo "ROM ZIP: **$(cat /tmp/rbe-test/rom-filename.txt)**"
              echo ''
              echo '```text'
              cat /tmp/rbe-test/rom-sha256.txt 2>/dev/null || true
              echo '```'
            else
              echo 'No verified ROM ZIP created in this run.'
            fi
            if [ -s /tmp/rbe-test/time-stop-triggered.txt ] || [ -s /tmp/rbe-test/graph-time-stop-triggered.txt ]; then
              echo '**Soft job deadline triggered during graph generation or ROM build.**'
            fi
            if [ -s /tmp/rbe-test/graph-disk-stop-triggered.txt ]; then
              echo '**Build graph stopped for low disk space.**'
            fi
            if [ -s /tmp/rbe-test/termination-signal.txt ]; then
              echo '**External termination signal observed:**'
              echo '```text'
              cat /tmp/rbe-test/termination-signal.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo '=== FINAL DISK AND MEMORY ==='
          df -h / /home/runner/work/los || true
          free -h || true

          echo '=== POST-BUILD OUTPUT STORAGE ==='
          {
            date -u +'%Y-%m-%dT%H:%M:%SZ'
            du -sh /home/runner/work/los/.repo /home/runner/work/los/out \
              2>/dev/null || true
            du -xhd1 /home/runner/work/los/out 2>/dev/null \
              | sort -h | tail -n 35 || true
          } 2>&1 | tee /tmp/rbe-test/disk-analysis-post-build.log

      - name: RBE diagnostics
        if: always()
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set +e

          mkdir -p /tmp/rbe-test

          echo "=== SAFE RBE ENV ==="
          cat /tmp/rbe-test/rbe-env.txt 2>/dev/null || true

          echo '=== CONFIGURE / LUNCH FAILURE SUMMARY ==='
          cat /tmp/rbe-test/configure-failure.txt 2>/dev/null || true
          echo '=== CONFIGURE STAGES ==='
          cat /tmp/rbe-test/configure-stages.log 2>/dev/null || true
          echo '=== CONFIGURE LOG TAIL (LAST 180 LINES) ==='
          tail -n 180 /tmp/rbe-test/configure-setup.log 2>/dev/null || true

          echo "=== RBE LOG DIRECTORY ==="
          find "$(readlink -f /tmp/rbe-test)" \
            -maxdepth 2 \
            -type f \
            -printf '%p %s bytes\n' \
            | sort | tail -n 80 || true

          echo "=== REPROXY PROCESSES ==="
          ps aux | grep -E '[r]eproxy|[r]ewrapper|[s]candeps' || true

          echo "=== DISK ==="
          df -h / /home/runner/work/los || true
          echo "=== STORAGE PROFILE SAMPLING ==="
          tail -n 30 /tmp/rbe-test/resource-samples.tsv 2>/dev/null || true
          echo "=== RESOURCE MONITOR ==="
          tail -n 60 /tmp/rbe-test/resource-monitor.log 2>/dev/null || true

          echo '=== PREBUILTS LARGEST DIRECTORIES ==='
          tail -n 25 /tmp/rbe-test/prebuilts-detail.log 2>/dev/null || true
          echo '=== REPO METADATA LARGEST DIRECTORIES ==='
          tail -n 25 /tmp/rbe-test/repo-size.log 2>/dev/null || true
          echo '=== CLANG TOOLCHAINS LARGEST DIRECTORIES ==='
          tail -n 25 /tmp/rbe-test/clang-detail.log 2>/dev/null || true
          echo '=== GRADLE PLUGIN LARGEST DIRECTORIES ==='
          tail -n 15 /tmp/rbe-test/gradle-detail.log 2>/dev/null || true
          echo '=== PLATFORM GIT OBJECTS LARGEST DIRECTORIES ==='
          tail -n 25 /tmp/rbe-test/platform-objects-detail.log 2>/dev/null || true
          echo '=== PREBUILTS MANIFEST PROJECT COUNT ==='
          wc -l /tmp/rbe-test/prebuilts-projects.log 2>/dev/null || true

          echo "=== REPROXY LOG TAIL ==="
          tail -n 220 /tmp/rbe-test/reproxy_log.txt 2>/dev/null || true

          echo "=== ALL AVAILABLE RECLIENT LOGS ==="
          find /tmp/rbe-test -maxdepth 3 -type f \
            \( -iname '*log*' -o -name '*.rpl' -o -iname '*metrics*' \) \
            -printf '%p %s bytes\n' | sort || true

          echo "=== RBE ERROR SUMMARY ==="
          grep -aRinE \
            'UNAUTHENTICATED|PERMISSION_DENIED|PermissionDenied|Unauthenticated|Unavailable|DeadlineExceeded|InvalidArgument|working_directory|input root|ResourceExhausted|ERROR|FATAL|failed|connection refused|no such file|exec format error' \
            /tmp/rbe-test \
            --exclude=full-rom-build.log \
            --exclude=m-nothing.log \
            --exclude='*.rrpl' \
            --exclude='*.rpi' \
            --exclude='*.INFO*' \
            --exclude='*.pb' \
            2>/dev/null | head -100 || true

          echo "=== RBE METRICS ==="
          cat /tmp/rbe-test/rbe_metrics.txt 2>/dev/null || true

          echo '=== PRIMARY SOONG RUNTIME PATCH ==='
          cat /tmp/rbe-test/soong-go-runtime-patch.txt 2>/dev/null || true
          echo '=== SOONG GC HEAP SAMPLES ==='
          tail -n 30 /tmp/rbe-test/soong-go-heap.tsv 2>/dev/null || true
          echo '=== PRIMARY SOONG PROCESS ENVIRONMENT (WHITELISTED) ==='
          cat /tmp/rbe-test/soong-proc-environ.tsv 2>/dev/null || true
          echo "=== BUILD GRAPH LOG TAIL ==="
          tail -n 160 /tmp/rbe-test/m-nothing.log 2>/dev/null || true

          echo "=== FULL ROM BUILD LOG TAIL ==="
          tail -n 260 /tmp/rbe-test/full-rom-build.log 2>/dev/null || true
          echo "=== BUILD STOP REASONS ==="
          cat /tmp/rbe-test/*-stop-triggered.txt 2>/dev/null || true
          echo '=== EXTERNAL TERMINATION SIGNAL ==='
          cat /tmp/rbe-test/termination-signal.txt 2>/dev/null || true
          echo '=== HYBRID SWAP STATUS ==='
          cat /tmp/rbe-test/zram-status.txt /tmp/rbe-test/swap-status.txt \
            /tmp/rbe-test/graph-swap-reclaim.txt 2>/dev/null || true
          swapon --show=NAME,TYPE,SIZE,USED,PRIO || true
          zramctl || true
          echo '=== MEMORY PRESSURE TAIL ==='
          tail -n 160 /tmp/rbe-test/memory-pressure.log 2>/dev/null || true
          echo '=== SOONG GO VERSION AND ACTIVE GC LIMIT ==='
          cat /tmp/rbe-test/soong-go-runtime.txt 2>/dev/null || true
          cat /tmp/rbe-test/soong-build-binary-go-version.txt 2>/dev/null || true
          echo '=== SOONG MEMORY SAMPLES TAIL ==='
          tail -n 30 /tmp/rbe-test/soong-memory-samples.tsv 2>/dev/null || true
          echo '=== SOONG PROCESS PID / CPU / RSS SAMPLES TAIL ==='
          tail -n 30 /tmp/rbe-test/soong-process-samples.tsv 2>/dev/null || true
          echo '=== GRAPH GC TRACE RECENT LINES ==='
          tail -n 30 /tmp/rbe-test/soong-gc-trace-tail.log 2>/dev/null || true
          echo '=== GRAPH MEMORY GUARD DETAIL ==='
          cat /tmp/rbe-test/graph-memory-stop-triggered.txt 2>/dev/null || true
          echo '=== CGROUP OOM EVENT BASELINE ==='
          cat /tmp/rbe-test/cgroup-memory-events-before-graph.txt 2>/dev/null || true
          echo '=== P1 STORAGE TRIM SUMMARY ==='
          tail -n 50 /tmp/rbe-test/storage-trim-p1.log 2>/dev/null || true
          echo '=== SOONG GRAPH EXIT CODE ==='
          cat /tmp/rbe-test/graph-exit-code.txt 2>/dev/null || true
          echo "=== ROM ZIP FILES IF PRESENT ==="
          find /home/runner/work/los/out/target/product/star2lte -maxdepth 1 \
            -type f -name 'lineage-*.zip' -printf '%p %s bytes\n' 2>/dev/null || true

      - name: Release hybrid swap at job end (best effort)
        if: always()
        shell: bash
        run: |
          set +e
          # On a canceled/low-memory runner, swapoff can allocate several GiB
          # and trigger another OOM. Do not swapoff non-empty swap devices.
          # Runner is ephemeral; leave in-use devices until VM teardown.
          for SWAPFILE in /mnt/soong-swap-graph /mnt/soong-swap-base; do
            if [ ! -f "$SWAPFILE" ]; then continue; fi
            USED="$(swapon --bytes --noheadings --show=NAME,USED | awk -v path="$SWAPFILE" '$1==path {print $2; found=1; exit} END {if (!found) print "na"}')"
            if [ "$USED" = 0 ] && sudo swapoff "$SWAPFILE"; then
              sudo rm -f "$SWAPFILE"
              echo "Released unused swap $SWAPFILE"
            else
              echo "Retained swap $SWAPFILE used_bytes=$USED (na = unknown; not unlinking)"
            fi
          done
          if [ -s /tmp/rbe-test/zram-device.txt ]; then
            ZRAM_DEV="$(cat /tmp/rbe-test/zram-device.txt)"
            USED="$(swapon --bytes --noheadings --show=NAME,USED | awk -v path="$ZRAM_DEV" '$1==path {print $2; found=1; exit} END {if (!found) print "na"}')"
            if [ "$USED" = 0 ] && sudo swapoff "$ZRAM_DEV"; then
              sudo zramctl --reset "$ZRAM_DEV" || true
              echo "Released unused zram $ZRAM_DEV"
            else
              echo "Retained zram $ZRAM_DEV used_bytes=$USED"
            fi
          fi
          echo '=== SWAP AFTER SAFE CLEANUP ==='
          swapon --show || true
          df -h /

      - name: Stop BuildBuddy gRPC bridge and remove credentials
        if: always()
        shell: bash
        run: |
          set +e
          CFG="/tmp/buildbuddy-rbe-bridge/nginx.conf"
          if [ -f "$CFG" ]; then
            nginx -s quit -c "$CFG" >/dev/null 2>&1 || true
          fi
          rm -rf /tmp/buildbuddy-rbe-bridge
          echo "BuildBuddy bridge configuration removed."

      - name: Final Soong intermediates profile and ZSTD comparison
        if: always()
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set +e
          set -o pipefail
          DIR="$(readlink -f /tmp/rbe-test 2>/dev/null)"
          [ -n "$DIR" ] && [ -d "$DIR" ] || exit 0
          if [ -f "$DIR/soong_storage_probe.py" ]; then
            timeout 100s python3 "$DIR/soong_storage_probe.py" \
              out/soong/.intermediates "$DIR" final \
              >> "$DIR/soong-storage-profile.log" 2>&1 || true
          fi
          echo '=== SOONG BIGGEST OUTPUT TYPES ==='
          head -n 18 "$DIR/soong-size-by-type.tsv" 2>/dev/null || true
          echo '=== SOONG BIGGEST MODULES ==='
          head -n 18 "$DIR/soong-size-by-module.tsv" 2>/dev/null || true
          # ZSTD 1 vs 3 comparison is read-only and bounded (no new image data).
          # A userspace file ratio is not identical to physical Btrfs extent savings.
          if command -v zstd >/dev/null && [ -s "$DIR/soong-largest-files.tsv" ]; then
            printf 'file\traw_bytes\tzstd1_bytes\tzstd3_bytes\n' > "$DIR/soong-zstd-comparison.tsv"
            count=0
            while IFS=$'\t' read -r logical blocks rel; do
              [[ "$logical" =~ ^[0-9]+$ ]] || continue
              # 0.5 MiB to 32 MiB and only compiler/linker inputs.
              if (( logical < 524288 || logical > 33554432 )); then continue; fi
              case "$rel" in *.o|*.a|*.so) ;; *) continue ;; esac
              file="out/soong/.intermediates/$rel"
              [ -f "$file" ] || continue
              if ! b1="$(timeout 12s zstd -q -1 -c -- "$file" | wc -c)"; then continue; fi
              if ! b3="$(timeout 12s zstd -q -3 -c -- "$file" | wc -c)"; then continue; fi
              printf '%s\t%s\t%s\t%s\n' "$rel" "$logical" "$b1" "$b3" >> "$DIR/soong-zstd-comparison.tsv"
              count=$((count+1))
              (( count >= 12 )) && break
            done < "$DIR/soong-largest-files.tsv"
          fi
          echo '=== HOST BACKING IMAGE AFTER BUILD ==='
          df -B1 --output=avail / | tail -2
          stat -c 'image_blocks=%b image_block_size=%B' /tmp/los20-workspace-btrfs.img 2>/dev/null || true

      - name: Final bounded JAR duplicate census (read only)
        if: always()
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set +e
          ROOT=out/soong/.intermediates
          DIR="$(readlink -f /tmp/rbe-test 2>/dev/null)"
          test -f "$DIR/ci_jar_dedupe.py" && test -d "$ROOT" || exit 0
          echo '=== FINAL JAR DUPLICATE CENSUS (READ-ONLY) ==='
          # Skip if another protected dedupe pass is still in progress.
          (
            exec 8>"$DIR/jar-dedupe.lock"
            flock -n 8 || exit 0
            ionice -c3 nice -n 15 timeout 85s python3 "$DIR/ci_jar_dedupe.py" \
              --root "$ROOT" --diagnostics "$DIR" --mode probe \
              --age-minutes 10 --hash-gib 2 --max-files 250
          ) >> "$DIR/jar-dedupe-worker.log" 2>&1 || true
          echo '=== JAR DEDUPE SUMMARY ==='
          tail -n 8 "$DIR/jar-dedupe-runs.tsv" 2>/dev/null | cut -c 1-300 || true

      - name: Finalize RBE metrics after compilation stops
        if: always()
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set +e
          test -d /tmp/rbe-test || exit 0
          echo '=== BEST EFFORT REPROXY GRACEFUL SHUTDOWN ==='
          # All m/ninja commands have exited. bootstrap -shutdown flushes stats.
          if pgrep -x reproxy >/dev/null && [ -x "${RBE_DIR}/bootstrap" ]; then
            timeout 60s "${RBE_DIR}/bootstrap" -shutdown -output_dir=/tmp/rbe-test \
              > /tmp/rbe-test/reproxy-finalize.log 2>&1
            RC=$?
            echo "bootstrap_shutdown_rc=$RC"
          fi
          if pgrep -x reproxy >/dev/null; then
            echo '::warning::reproxy is still active: active logs will remain untouched.'
          fi
          ls -lh /tmp/rbe-test/rbe_metrics* 2>/dev/null || true

      - name: Compact inactive reproxy logs while retaining failures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          DIR="$(readlink -f /tmp/rbe-test)"
          test -d "$DIR" || exit 0
          echo '=== BEFORE RBE LOG COMPACTION (REAL DIRECTORY) ==='
          du -sh "$DIR" || true
          # Do not mutate live reproxy logs, or consume active .rrpl during shutdown.
          if pgrep -x reproxy >/dev/null 2>&1; then
            echo '::warning::reproxy still running; skip compaction to protect metrics.'
            exit 0
          fi
          python3 - "$DIR" "$RBE_INFO_KEEP_MIB" "$RBE_RRPL_KEEP_MIB" <<'PYCLEAN'
          import pathlib,sys,os
          root=pathlib.Path(sys.argv[1]); tail=int(sys.argv[2])*1024*1024
          rrpl_limit=int(sys.argv[3])*1024*1024
          summary=[]
          for file in root.iterdir():
              if not file.is_file() or file.is_symlink(): continue
              name=file.name; size=file.stat().st_size
              # Keep ERROR/WARNING/metrics and the last portion of huge INFO logs.
              if (name.startswith(('reproxy.','bootstrap.','reproxy_')) and
                  ('.INFO.' in name or name.endswith('.INFO')) and size > 2*tail):
                  with file.open('rb') as src:
                      src.seek(-tail,os.SEEK_END); data=src.read(tail)
                  tmp=file.with_name(name+'.compact')
                  tmp.write_bytes(data)
                  os.replace(tmp,file)
                  summary.append((name,size,len(data),'tail-kept'))
              elif name.startswith('reproxy_') and name.endswith('.rrpl') and size>rrpl_limit:
                  # Only discard oversized action logs once final metrics exist.
                  if (root/'rbe_metrics.txt').is_file() and (root/'rbe_metrics.pb').is_file():
                      file.unlink()
                      summary.append((name,size,0,'removed-post-metrics'))
          report=root/'rbe-log-compaction.tsv'
          report.write_text('file\tbefore_bytes\tafter_bytes\tstatus\n'+''.join(
              f'{name}\t{old}\t{new}\t{state}\n' for name,old,new,state in summary))
          print(f'Compacted {len(summary)} files')
          PYCLEAN
          echo '=== AFTER RBE LOG COMPACTION ==='
          du -sh "$DIR" || true
          df -h /

      - name: Stage bounded, explicit diagnostic artifact
        id: stage_diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          SRC="$(readlink -f /tmp/rbe-test)"
          DST=/home/runner/work/los/rbe-upload
          mkdir -p "$DST"
          python3 - "$SRC" "$DST" <<'PYSTAGE'
          import os, pathlib, sys
          src,dst=(pathlib.Path(a) for a in sys.argv[1:])
          if not src.is_dir(): raise SystemExit(0)
          # Whitelist file types. Never copy raw rrpl, INFO, key-bearing
          # reproxy command dumps, or a multi-GiB compiler output wholesale.
          forbidden=('.rrpl','.rpl','.redacting','.compact')
          count=0
          for file in src.iterdir():
              if file.is_symlink() or not file.is_file(): continue
              name=file.name
              if name.startswith(('reproxy.','bootstrap.','rewrapper.','scandeps_server.')) or name.endswith(forbidden): continue
              if name.startswith('reproxy_') and '.rrpl' in name: continue
              if file.suffix not in ('.txt','.tsv','.log','.xml','.patch','.pb','.json','.md'):
                  continue
              # Risky raw action logs / unbounded CI compiler output are excluded.
              if 'reproxy_log' in name or 'reproxy.INFO' in name: continue
              size=file.stat().st_size
              limit=6*1048576 if name in ('full-rom-build.log','m-nothing.log') else 3*1048576
              if file.suffix=='.pb': limit=8*1048576
              with file.open('rb') as source, (dst/name).open('wb') as target:
                  if size > limit:
                      # Take end to capture failure; annotate truncation clearly.
                      target.write(f'[TRUNCATED LOG: original_bytes={size}, preserved_tail_bytes={limit}]\n'.encode())
                      source.seek(-limit,os.SEEK_END)
                  while True:
                      chunk=source.read(1048576)
                      if not chunk: break
                      target.write(chunk)
              count+=1
          (dst/'artifact-stage-summary.txt').write_text(f'files={count}\nraw_rrpl_excluded=true\nlarge_logs_tailed=true\n')
          print(f'Diagnostic files staged: {count}')
          PYSTAGE
          echo '=== UPLOAD PAYLOAD SIZE ==='
          du -sh "$DST"
          df -h /

      - name: Redact BuildBuddy API key from RBE artifacts
        id: redact_diagnostics
        if: ${{ always() && steps.stage_diagnostics.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          # Streaming, bounded-memory redaction. No read_bytes() of multi-GiB
          # files, no secret in the workflow stdout or command line.
          python3 - <<'PYREDACT'
          import os
          from pathlib import Path
          key=os.environ.get('BUILDBUDDY_API_KEY','').encode()
          # Redact ONLY the bounded upload snapshot, not multi-GiB active raw RBE logs.
          root=Path('/home/runner/work/los/rbe-upload')
          if not key or not root.is_dir(): raise SystemExit('Refusing unredacted diagnostics upload: key or staging missing')
          assert len(key)>0
          chunk=1024*1024
          for file in root.rglob('*'):
              if not file.is_file() or file.is_symlink(): continue
              temp=file.with_name(file.name+'.redacting')
              dirty=False; remain=b''
              try:
                  with file.open('rb') as src, temp.open('wb') as dst:
                      while True:
                          block=src.read(chunk)
                          if not block: break
                          data=remain+block
                          if key in data: dirty=True
                          scrub=data.replace(key,b'*'*len(key))
                          cut=max(0,len(scrub)-len(key)+1)
                          dst.write(scrub[:cut]); remain=scrub[cut:]
                      if key in remain: dirty=True
                      dst.write(remain.replace(key,b'*'*len(key)))
                  if dirty:
                      os.chmod(temp,file.stat().st_mode)
                      os.replace(temp,file)
                      print('Redacted secret from:',file.relative_to(root))
                  else: temp.unlink()
              finally:
                  if temp.exists(): temp.unlink()
          PYREDACT

      - name: Upload full ROM trial diagnostics
        # Never upload if staging/redaction failed; even partial logs may contain secrets.
        if: ${{ always() && steps.stage_diagnostics.outcome == 'success' && steps.redact_diagnostics.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: rbe-test-logs-${{ github.run_id }}
          path: /home/runner/work/los/rbe-upload/
          if-no-files-found: error
          retention-days: 7

      # Always run AFTER ROM and diagnostic uploads; keep mount live for upload.
      - name: Unmount compressed workspace (best effort)
        if: ${{ always() && inputs.workspace_storage == 'btrfs_zstd' }}
        shell: bash
        run: |
          set +e
          WORKSPACE=/home/runner/work/los
          BACKING=/tmp/los20-workspace-btrfs.img
          echo '=== BTRFS FINAL PHYSICAL USAGE ==='
          df -hT / "$WORKSPACE"
          du -h "$BACKING" 2>/dev/null || true
          sync
          if mountpoint -q "$WORKSPACE"; then
            sudo umount "$WORKSPACE"
          fi
          if ! mountpoint -q "$WORKSPACE"; then
            rm -f -- "$BACKING"
            echo 'Btrfs workspace detached; backing image removed.'
          else
            echo '::warning::Btrfs mount busy; leaving image to runner teardown.'
          fi
